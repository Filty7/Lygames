<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Desert Fever – pixel-art manažer týmu pouštní rallye. Alfa verze, single player i online multiplayer.">
<link rel="icon" href="../../favicon.svg">
<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Desert Fever</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Racing+Sans+One&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: pixel-art obrazovky (setup → nákup → bivak ⇄ etapa), tmavá pouštní noc s pískem a oranžovou Dakar barvou jako rizikovou zónou */
:root{
  color-scheme:dark;
  --bg:#1a1310; --panel:#2e231c; --panel2:#3b2e25; --line:#5a4430; --ink:#f3e7d3; --mute:#b39f88;
  --sand:#e9c48b; --dakar:#ff8c2a; --ok:#79d26c; --warn:#ffb13b; --bad:#ef5a43; --sky:#7cc3e6; --shadow:#0c0705; --f-st:'Saira Stencil One','Barlow Condensed',Impact,sans-serif;
  --f-pix:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --f-body:'Barlow',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
#app{max-width:1500px;margin:0 auto}
#app:has(.bv){max-width:2000px}
h1,h2,h3{font-family:var(--f-pix);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:20px} h3{font-size:16px;color:var(--sand)}
.mute{color:var(--mute)} .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:12px;min-width:0}
.panel>h3{margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
button{font-family:var(--f-pix);font-size:14px;color:var(--ink);background:var(--panel2);border:2px solid var(--line);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--shadow);white-space:nowrap}
button:hover:not(:disabled){border-color:var(--sand)}
button:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
button.primary{background:var(--dakar);color:#1f1209;border-color:#ffb067;font-weight:700}
button.on{background:var(--sand);color:#24180b;border-color:#fff1d2}
button.small{font-size:12px;padding:2px 7px}
button.danger{border-color:var(--bad);color:#ffd0c8}
select,input[type=text],input[type=number]{font-family:var(--f-body);font-size:14px;background:#1a1520;color:var(--ink);border:2px solid var(--line);padding:4px 6px;max-width:100%}
input[type=color]{width:46px;height:30px;border:2px solid var(--line);background:#1a1520;padding:1px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-family:var(--f-pix);font-size:12px;padding:1px 6px;border:1px solid var(--line);background:#1a1520;white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#3c6a37}.pill.warn{color:var(--warn);border-color:#7a5a20}.pill.bad{color:var(--bad);border-color:#7b3027}.pill.sky{color:var(--sky);border-color:#2d5a70}
.bar{height:8px;background:#151018;border:1px solid #3a3040;position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);transition:width .3s}
.bar>s{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,#5a2a26 0 3px,#1d1418 3px 6px);text-decoration:none}
.station.away{opacity:.8}
.injb{font-family:var(--f-pix);font-size:12px;padding:0 6px;border:1px solid var(--warn);color:var(--warn);background:#1a1520;white-space:nowrap;cursor:help;display:inline-block}
.injb.ser{border-color:var(--bad);color:var(--bad)}
.chip.ghost{opacity:.55;filter:grayscale(.7);cursor:not-allowed}
canvas.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hint{font-size:12px;color:var(--mute)}
#tip{position:fixed;z-index:90;pointer-events:none;background:#14101a;border:2px solid var(--sand);padding:8px 10px;font-size:13px;max-width:300px;box-shadow:4px 4px 0 var(--shadow)}
#tip b{font-family:var(--f-pix);color:var(--sand);font-weight:400;font-size:15px}

/* setup */
.hero{text-align:center;padding:14px 0 6px}
.hero h1{font-size:clamp(44px,8vw,96px);font-weight:800;font-style:italic;line-height:.9;color:var(--sand);text-shadow:4px 4px 0 #8a3b12}
.hero h1 span{color:var(--dakar);display:block;font-size:.5em;letter-spacing:.3em;text-shadow:3px 3px 0 var(--shadow)}
.hero .tag{color:var(--mute);margin:10px 0 0}
#heroCars{width:100%;max-width:960px;margin:0 auto;height:auto}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:14px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label,.lbl{font-family:var(--f-pix);font-size:13px;color:var(--mute);letter-spacing:.04em}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:42px;height:26px;border:2px solid var(--line);cursor:pointer;padding:0;display:flex}
.sw i{flex:1}
.sw.on{border-color:var(--ink);outline:2px solid var(--dakar)}
input[type=range]{width:100%;accent-color:var(--dakar)}
.bigmoney{font-family:var(--f-pix);font-size:40px;color:var(--sand);line-height:1}

/* shop */
.shop-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;margin-top:12px}
@media (min-width:1100px) and (min-height:620px){.shop-fit{height:calc(100vh - 24px);display:grid;grid-template-rows:auto minmax(0,1fr)}.shop-fit .shop-grid{min-height:0}.shop-fit .shop-grid>*{min-height:0;overflow:auto;scrollbar-width:thin}}
@media (max-width:900px){.shop-grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--panel2);border:2px solid var(--line);border-top:6px solid var(--rc,var(--line));padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.free{border-style:dashed;border-top-style:solid}
.card .ttl{font-family:var(--f-pix);font-size:16px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.card .who{display:flex;gap:8px;align-items:center}
.card .who canvas{width:40px;height:40px;border:2px solid var(--rc)}
.card .price{font-family:var(--f-mono);color:var(--sand)}
.skl{display:grid;grid-template-columns:100px 1fr 18px;gap:4px 6px;align-items:center;font-size:12px}
.skl .bar{height:6px}
.skl .bar>i{background:var(--sand)}
.skl b{font-family:var(--f-mono);font-weight:600;text-align:right}
.card canvas.carc{width:100%;height:auto;background:#3b3143}
.team-list{display:grid;gap:6px}
.team-item{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.check{display:grid;gap:3px;font-family:var(--f-pix);font-size:13px}

/* bivak */
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--panel);border:2px solid var(--line);padding:8px 12px;box-shadow:4px 4px 0 var(--shadow)}
.clock{font-family:var(--f-pix);font-weight:700;font-size:36px;line-height:1;color:var(--sand);font-variant-numeric:tabular-nums;min-width:4.2ch}
.datebox{display:grid;line-height:1.15}
.datebox .d{font-family:var(--f-pix);font-size:14px}
.startin{font-family:var(--f-pix);font-size:16px;padding:4px 10px;border:2px solid var(--line);background:#1a1520;min-width:270px;font-variant-numeric:tabular-nums}
.money{font-family:var(--f-mono);min-width:120px;text-align:right;display:inline-block}
.status{flex-basis:100%;min-height:24px;font-size:13px;display:flex;align-items:center;gap:8px;color:var(--mute);border-top:1px dashed var(--line);padding-top:6px}
.status .warn{color:var(--warn)}
.startin b{font-size:20px;color:var(--dakar);font-weight:700;font-family:var(--f-pix);display:inline-block;min-width:8.5ch}
.startin.soon{border-color:var(--dakar);animation:pulse 1s steps(2) infinite}
.speedbtns button{min-width:44px}
.bivak-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr) minmax(0,.85fr);gap:14px;margin-top:14px;align-items:start}
@media (max-width:1240px){.bivak-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}.bivak-grid>.col:last-child{grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}}
@media (max-width:760px){.bivak-grid{grid-template-columns:1fr}}
.col{display:grid;gap:14px;min-width:0;align-content:start}
.scene-panel{padding:0;position:relative}
.scene-panel canvas{width:100%;height:auto}
.scene-label{position:absolute;left:8px;top:6px;font-family:var(--f-pix);font-size:13px;background:rgba(20,15,25,.7);padding:1px 6px}
.comp{display:grid;grid-template-columns:96px 30px 1fr 40px 76px;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.comp .q{font-family:var(--f-pix);color:var(--sand)}
.tyres{margin-top:8px;padding-top:8px;border-top:2px dashed var(--line);display:grid;gap:6px}
.setup-row{display:grid;gap:4px;margin:8px 0;padding-bottom:8px;border-bottom:1px dashed #3a3040}
.setup-row .head{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.setup-row .head b{font-family:var(--f-pix);font-weight:400}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.steps button{padding:5px 0;font-size:13px;position:relative}
.steps button.cur{background:var(--sand);color:#24180b;border-color:#fff1d2;font-weight:700}
.steps button.cur::after{content:"TEĎ";position:absolute;left:0;right:0;bottom:-14px;font-size:9px;color:var(--sand);letter-spacing:.08em}
.steps button.tgt{border-color:var(--dakar);box-shadow:0 0 0 2px var(--dakar)}
.steps button.tgt::after{content:"CÍL";position:absolute;left:0;right:0;bottom:-14px;font-size:9px;color:var(--dakar);letter-spacing:.08em}
.setup-row .ends{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;color:var(--mute);margin-top:12px;line-height:1.3}
.setup-row .ends span:last-child{text-align:right}
details summary{cursor:pointer;font-family:var(--f-pix);font-size:13px;color:var(--sky)}
.ideal td,.ideal th{padding:3px 6px;font-size:12px}
.biobar{display:flex;height:18px;border:2px solid var(--line);margin:6px 0}
.biobar i{display:block;height:100%;cursor:help}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}
.legend span{cursor:help}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.log{font-size:12.5px;display:grid;gap:3px;max-height:240px;overflow:auto}
.log div{border-left:3px solid var(--line);padding-left:6px}
.log .t{font-family:var(--f-mono);color:var(--mute);margin-right:4px}
.log .warn{border-color:var(--warn)}.log .bad{border-color:var(--bad)}.log .ok{border-color:var(--ok)}.log .xp{border-color:var(--sky)}
.banner{border:2px dashed var(--warn);padding:6px 8px;font-size:13px;color:var(--warn);margin-bottom:8px}
.float-res{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;font-size:16px;padding:10px 16px}
.pulse{animation:pulse 1.2s steps(2) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--dakar)}}

/* fit layouts (16:9, no page scroll) */
@media (min-width:1100px) and (min-height:620px){
  .fit{height:calc(100vh - 24px);display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}
  .fit .bivak-grid{margin-top:0;min-height:0;height:100%;align-items:stretch}
  .fit .bivak-grid>.col{min-height:0;overflow:auto;padding-right:4px;scrollbar-width:thin}
  .fit.race{grid-template-rows:auto minmax(0,1fr)}
  .fit .race-grid{margin-top:0;min-height:0;height:100%}
  .fit .race-grid>div{min-height:0;overflow:auto;scrollbar-width:thin}
  .fit .scene-wrap canvas{width:100%;height:auto;margin:0}
  .fit .others{max-height:none}
}
.scene-wrap{display:flex;justify-content:center}
/* stations */
.stations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.station{background:color-mix(in srgb,var(--sc) 9%,var(--panel));border:2px solid color-mix(in srgb,var(--sc) 45%,var(--line));box-shadow:4px 4px 0 var(--shadow);padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.station.wide{grid-column:1/-1}
.station>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.station>header h3{display:flex;gap:8px;align-items:center}
.station>header h3 i{display:inline-block;width:12px;height:12px;background:var(--sc)}
.drop{border:2px dashed color-mix(in srgb,var(--sc,#4b3e53) 40%,#4b3e53);background:color-mix(in srgb,var(--sc,#211b27) 6%,#211b27);padding:6px;min-height:52px;display:grid;gap:6px;align-content:start;transition:border-color .1s,background .1s}
.drop.over{border-color:var(--dakar);background:#3a2a22}
.drop .dh{display:flex;justify-content:space-between;gap:6px;font-size:13px;align-items:baseline;flex-wrap:wrap}
.drop .dh b{font-family:var(--f-pix);font-weight:400;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:38px;align-content:flex-start;overflow:auto;scrollbar-width:thin}
.drop[data-drop=rest] .chips{height:118px}.drop[data-drop=cook] .chips,.drop[data-drop=medic] .chips{height:40px}.drop[data-drop=patient] .chips{height:80px}.jobs .drop .chips,.drop[data-drop^='prep:'] .chips{height:40px}
.jobs .drop{height:128px;overflow:hidden}
.chips .empty{font-size:12px;color:#6d6070;align-self:center}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--rc);border-left-width:6px;padding:2px 6px 2px 2px;cursor:grab;user-select:none;min-width:0;max-width:100%}
.chip.sel{box-shadow:0 0 0 2px var(--sky)}
.chip.locked{cursor:default;opacity:.75}
.chip canvas{width:32px;height:32px;flex:none}
.chip .cinfo{display:grid;gap:2px;min-width:0}
.chip .cinfo b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.chip .ebar{width:70px;height:5px;background:#151018;position:relative}
.chip .ebar i{position:absolute;inset:0 auto 0 0}
.chip .bdg{font-family:var(--f-pix);font-size:11px;line-height:1.1;display:grid;gap:1px}
.chip .bdg span{padding:0 3px;background:#1a1520}
.prog{display:grid;gap:3px}
.prog .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .bar{height:10px}
.detail{display:grid;gap:8px}
.detail .who{display:flex;gap:10px;align-items:center}
.detail .who canvas{width:64px;height:64px;border:3px solid var(--rc)}
.skx{display:grid;grid-template-columns:110px 18px 1fr;gap:3px 6px;align-items:center;font-size:12px}
.skx .bar{height:6px}.skx .bar>i{background:var(--sky)}
.skx b{font-family:var(--f-mono);text-align:right}


/* bivak layout: 3 columns, no page scroll */
.bv{display:grid;grid-template-columns:clamp(290px,21vw,400px) minmax(0,1fr) clamp(300px,21.5vw,396px);grid-template-rows:auto minmax(0,1fr);gap:10px;height:calc(100vh - 24px);min-height:560px}
.bv>.topbar{grid-column:1/-1;padding:6px 12px;gap:8px 12px}
.bv .topbar .clock{font-size:32px}
.bv .topbar .startin{min-width:230px}
.bv .topbar button{padding:4px 9px}
.bv .topbar .status{padding-top:4px;min-height:0}
.bv-left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.bv-left .scene-panel{flex:none}
.bv-left .scene-panel canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.carcard{flex:none;display:grid;gap:8px;padding:10px}
.carhead{display:flex;gap:10px;align-items:center}
.carhead .bigcar{width:120px;height:65px;flex:none;image-rendering:pixelated}
.carhead .ch-t{display:grid;gap:1px;min-width:0}
.carhead h3{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitline{font-size:13px}
.cqs{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.cq{display:grid;grid-template-columns:52px 34px 1fr 22px;gap:5px;align-items:center;font-size:12px}
.cq b{font-family:var(--f-pix);color:var(--sand);font-weight:600}
.cq b sup{color:var(--sky)}
.cq .bar{height:7px}
.cq .num{text-align:right;font-size:11px}
.carbtn{width:100%;font-size:15px;padding:7px}
.stagecard{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:10px}
.stagecard>h3{margin:0}
.stagecard .biobar{margin:0;flex:none}
.stagecard .banner{margin:0}
.sg-move{font-size:12.5px;color:var(--mute)}
.sg-prep{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--mute)}
.sg-prep .ok{color:var(--ok)}
.sg-prep em{font-style:normal;color:var(--sky)}
.bv-mid{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.bv-mid .station{gap:6px;padding:8px 10px}
.bv-mid .station>header{align-items:center}
.bv-mid .station>header .hint{margin-right:auto}
.station.shop{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.station.shop .jobs{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:thin;align-content:start;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));padding:2px}
.station.staff,.lowrow{flex:none}
.prepz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.drop.job,.prepz .drop{height:118px;overflow:hidden;align-content:start}
.prepz .drop.done{border-style:solid;opacity:.85}
.prepz .eff{font-size:12px;line-height:1.25}
.lowrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
.lowrow .drop{min-height:0;height:78px;overflow:hidden}
.medz{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.injl{display:grid;gap:3px;max-height:44px;overflow:hidden}
.injl>div{display:grid;grid-template-columns:80px auto 1fr;gap:6px;align-items:center;font-size:12px}
.wk{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;align-items:center}
.wk .empty{font-size:12px;color:#6d6070}
.mini{display:flex;align-items:center;gap:5px;background:var(--panel2);border:2px solid var(--rc);border-left-width:5px;padding:1px 6px 1px 1px;cursor:grab;user-select:none;max-width:100%;position:relative}
.mini canvas{width:28px;height:28px;flex:none}
.mini .mn{font-size:12.5px;font-weight:600;white-space:nowrap}
.mini .eb{width:34px}
.mini.locked{cursor:default;opacity:.7}
.wk.stack{gap:0}
.wk.stack .mini{padding:1px;margin-right:-10px;flex-direction:column;gap:1px}
.wk.stack .mini:hover{z-index:2}
.wk.stack .mini .mn{display:none}
.wk.stack .mini .eb{width:28px;height:3px}
.eb{display:block;height:5px;background:#151018;position:relative;overflow:hidden}
.eb>i{position:absolute;inset:0 auto 0 0}
.roster{min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px;border-style:dashed}
.roster.over{border-color:var(--dakar);background:#3a2a22}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex:none}

function makePerson(role,quality,opt={}){
  const sk={};const ks=ROLES[role].skills;const work=ks.filter(k=>k!=='vydrz');
  const order=shuffle(ks.slice());const nStrong=ks.length>3?RI(1,2):1,nWeak=ks.length>3?RI(1,2):1;
  const strong=order.slice(0,nStrong),weak=order.slice(nStrong,nStrong+nWeak);
  for(const k of ks){let v=quality+(strong.includes(k)?R(1.5,3.6):weak.includes(k)?-R(2.4,4.8):R(-1,1));sk[k]=v}
  // trade-off: a driver who is great at most things pays for it with stamina (and vice versa)
  const wAvg=avg(work.map(k=>sk[k]));if(wAvg>quality+.6)sk.vydrz=Math.min(sk.vydrz,quality-R(1.5,4));else if(wAvg<quality-.6)sk.vydrz=Math.max(sk.vydrz,quality+R(1,3));
  for(const k of ks)sk[k]=clamp(Math.round(sk[k]),0,10);
  if(opt.flat!=null)for(const k of ks)sk[k]=opt.flat;
  const p={id:uid(),name:opt.name||personName(),role,sk,xp:{},mistakes:0,energy:100,inj:null,task:'rest',face:makeFace()};
  p.price=opt.free?0:personPrice(role,sk);
  if(opt.free)p.free=true;
  return p;
}

  const cm=CAR_MODELS.filter(m=>!m.free).sort((a,b)=>carPrice(a.q)-carPrice(b.q));const pickC=[];for(let i=0;i<nb;i++){const j=Math.min(cm.length-1,Math.round(i*(cm.length-1)/(nb-1)+R(-1,1)));const m=cm[clamp(j,0,cm.length-1)];if(!pickC.includes(m))pickC.push(m)}
  for(const m of shuffle(cm))if(pickC.length<nb&&!pickC.includes(m))pickC.push(m);
  pickC.sort((a,b)=>carPrice(a.q)-carPrice(b.q)).forEach(m=>pool.push({kind:'car',id:uid(),model:m.id,price:carPrice(m.q)}));
  pool.push({kind:'person',...makePerson('jezdec',1,{flat:1,free:true,name:'Strejda Franta'})});

function genRace(set){
  const cfg={short:{n:7,rest:3,mar:[[5,6]]},std:{n:13,rest:6,mar:[[4,5],[9,10]]},long:{n:15,rest:7,mar:[[4,5],[10,11]]}}[set.days];
  const base=[305,400,422,451,356,331,462,481,418,371,347,310,105];
  const lenMul={short:.65,classic:1,long:1.25}[set.len];
  const types={
    'Dunová':{duny:6,plan:1,fesh:2,kameny:.5,vadi:.5},
    'Kamenitá':{kameny:6,vadi:2,plan:1.5,duny:.5,fesh:.3},
    'Rychlá':{plan:6,vadi:2,kameny:1,duny:.6,fesh:.3},
    'Smíšená':{plan:2,duny:2,kameny:2,vadi:2,fesh:1.5},
    'Navigační':{vadi:5,kameny:2,fesh:2,duny:1,plan:1},
    'Fesh-fesh':{fesh:5,duny:2,plan:1.5,kameny:1,vadi:.8},
  };
  const stages=[];let day=1,restDay=null;
  for(let i=1;i<=cfg.n;i++){
    const last=i===cfg.n;
    let km=(cfg.n===13?base[i-1]:(last?R(100,140):R(300,480)))*R(.88,1.12)*lenMul;km=Math.round(km);
    const type=last?'Rychlá':pick(Object.keys(types));
    const wAll={...types[type]};const nb=+wpick({1:.06,2:.28,3:.38,4:.22,5:.06});const w={};
    for(let j=0;j<nb;j++){const b=wpick(wAll);w[b]=wAll[b];delete wAll[b]}
    const segs=[];let sum=0,prev=null;
    while(sum<km){let b;let g=0;do{b=wpick(w);g++}while(b===prev&&g<8&&nb>1);let l=Math.round(R(14,62));if(sum+l>km-8)l=km-sum;
      if(b===prev&&segs.length){segs[segs.length-1].km+=l}else segs.push({b,km:l});sum+=l;prev=b}
    let sm=pick([360,390,420,420,450,450,480,480,510,540]);
    if(km>430)sm-=60;
    const nightStart=!last&&rand()<.16;if(nightStart)sm=pick([240,270,300]);
    if(last)sm=pick([480,540]);
    let mar=0;for(const[a,b]of cfg.mar){if(i===a)mar=1;if(i===b)mar=2}
    const rainP=clamp(Math.pow(rand(),1.6)*.55+.03,.03,.6);
    const move=(mar===1||last)?0:(rand()<.08?0:Math.round(R(3,10)*60));
    stages.push({n:i,day,start:day*1440+sm,dep:day*1440+sm,liaIn:0,liaOut:0,preKm:0,postKm:0,move,moveKm:Math.round(move/60*70),convoy:null,fc:0,km,segs,type,mar,rainP,rainRoll:rand()<rainP,fNoise:rand()*2-1,nightStart,rain:null,runs:null,player:null,final:false,table:null,resultsAt:null,
      warned:false});
    day++;
    if(i===cfg.rest){restDay=day;day++}
  }
  return{stages,restDay,lastDay:day};
}

const lvl=(p,k)=>p?(p.sk[k]||0):0;
function eff(p,k){if(!p)return 0;let s=lvl(p,k);const ij=p.inj;if(ij){if(ij.serious&&(ij.skill===k||k==='vydrz'))s=Math.max(0,s-ij.pen);else if(!ij.serious&&ij.lvl>=3&&k==='vydrz')s=Math.max(0,s-1)}return s*(0.4+0.6*p.energy/100)}
const compEff=c=>c.q*(0.55+0.45*c.cond/100);
function carTop(car){return(90+11*compEff(car.comps.motor))*(1+0.03*car.setup.prevody-0.015*car.setup.vyska)}
function setupScore(setup,b){let d=0;for(const k of SK_KEYS)d+=Math.abs(setup[k]-BIOMES[b].setup[k]);return 1-d/16}
function weatherMul(b,rain){return rain?BIOMES[b].rainMul:1}
function tyreMul(car,rain,tyre){
  let tm=0.85+0.15*car.comps.pneu.cond/100;
  if(tyre){if(rain&&tyre==='dry')tm*=.82;else if(!rain&&tyre==='wet')tm*=.93}
  return tm;
}
function voptGeneric(car,skillFn,b,rain,night,setupS,tyre){
  const B=BIOMES[b];
  const cs=avg(B.comps.map(k=>compEff(car.comps[k])))/10;
  const ds=avg(B.skill.map(skillFn))/10;
  const ss=setupS!=null?setupS:setupScore(car.setup,b);
  let wm=weatherMul(b,rain);if(rain&&tyre==='wet')wm=1-(1-wm)*.5;
  return carTop(car)*B.cap*(0.62+0.2*cs+0.18*ds)*(0.8+0.2*ss)*wm*tyreMul(car,rain,tyre)*(night?0.9:1);
}
function physMax(car,b,rain,tyre){return carTop(car)*BIOMES[b].phys*(rain&&b==='vadi'&&tyre!=='wet'?.88:1)*(!rain&&tyre==='wet'?.92:1)}
function needXP(L){return 100+100*L}
function addXP(p,k){
  const gain=Math.round(100*Math.pow(0.9,p.mistakes));p.mistakes++;
  p.xp[k]=(p.xp[k]||0)+gain;
  let up=false;
  while((p.sk[k]||0)<10&&p.xp[k]>=needXP(p.sk[k]||0)){p.xp[k]-=needXP(p.sk[k]||0);p.sk[k]=(p.sk[k]||0)+1;up=true}
  if(up)logAny(`${p.name} se poučil z chyby: ${SKILLS[k]} → ${p.sk[k]}`,'xp');
  return gain;
}
function person(id){return S.team.people.find(p=>p.id===id)}
function addSuccXP(p,k,ch){if(!p||!k||rand()>ch)return;p.succ=p.succ||0;const gain=Math.round(45*Math.pow(.9,p.succ));p.succ++;p.xp[k]=(p.xp[k]||0)+gain;let up=false;
  while((p.sk[k]||0)<10&&p.xp[k]>=needXP(p.sk[k]||0)){p.xp[k]-=needXP(p.sk[k]||0);p.sk[k]=(p.sk[k]||0)+1;up=true}
  if(up)logAny(`${p.name} se zlepšil praxí: ${SKILLS[k]} → ${p.sk[k]}`,'xp')}

function addInjury(p,inj){if(!p)return;inj.h0=inj.h;
  if(!p.inj){p.inj=inj;return}
  const fix=()=>{p.inj.h0=Math.max(p.inj.h0||0,p.inj.h)};
  if(inj.serious){p.inj={...inj,h:inj.h+(p.inj.serious?p.inj.h*.3:0)};fix();return}

function carSpriteHD(shape,livery,number){

  const sh=SHAPES[shape]||SHAPES.suv;const K=2,OX=2,OY=6;const W=sh.L*K+8,H=46;
  const g=Array.from({length:H},()=>Array(W).fill(null));
  const set=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<W&&y<H)g[y][x]=c};
  const[c1,c2]=livery;const L2=sh.L*K;

  // cabin
  for(let y=top;y<=bot;y++){const f=(y-top)/(bot-top);const xl=OX+(sh.tl+(sh.bl-sh.tl)*f)*K,xr=OX+(sh.tr+(sh.br-sh.tr)*f)*K+1;
    for(let x=Math.round(xl);x<=Math.round(xr);x++)set(x,y,y<=top+1?shade(c2,1.05):shade(c1,1.05-f*.12))}
  // windows
  for(let y=top+3;y<bot-1;y++){const f=(y-top)/(bot-top);const xl=OX+(sh.tl+(sh.bl-sh.tl)*f)*K+3,xr=OX+(sh.tr+(sh.br-sh.tr)*f)*K-2;const mid=Math.round((xl+xr)/2);
    for(let x=Math.round(xl);x<=Math.round(xr);x++){if(Math.abs(x-mid)<=1)continue;const gl=(x-xl)/(xr-xl);let c=mixc('#22323f','#7d9db3',clamp(gl*.6+(1-f)*.4,0,1));if(((x+y*1.4)%11)<2)c='#c8dceb';set(x,y,c)}}
  // body
  const bt=sh.body[0]*K+OY,bb=sh.body[1]*K+OY+1;
  for(let y=bt;y<=bb;y++){const nose=y<bt+3?(bt+3-y)*2:0;const tail=y<bt+2?(bt+2-y):0;
    for(let x=OX+1+tail;x<=OX+L2-1-nose;x++){const f=(y-bt)/(bb-bt);let c=f<.12?shade(c1,1.3):f>.82?shade(c1,.62):shade(c1,1.08-f*.25);set(x,y,c)}}
  // livery stripe
  for(let x=OX+3;x<OX+L2-5;x++){set(x,bt+5,shade(c2,1.1));set(x,bt+6,c2);set(x,bt+7,c2);set(x,bt+8,shade(c2,.8))}
  // door seams + handle
  const dm=OX+Math.round(L2*.5);for(let y=bt+1;y<bb-1;y++){set(dm,y,shade(c1,.55))}for(let y=top+2;y<bt;y++)set(dm,y,shade(c1,.7));
  set(dm-5,bt+3,'#2a2328');set(dm-4,bt+3,'#2a2328');set(dm+6,bt+3,'#2a2328');set(dm+7,bt+3,'#2a2328');
  // number plate

function drawWorldHD(ctx,o){

    ctx.fillStyle=sl>0?shd(c,1.06):sl<0?shd(c,.9):c;ctx.fillRect(x,hz-hh,1,hh+(base-hz));ctx.fillStyle=shd(c,1.14);if(sl>1)ctx.fillRect(x,hz-hh,1,2)}

    ctx.fillStyle=sl>0?shd(c,1.1):sl<0?shd(c,.86):c;ctx.fillRect(x,base-12-hh,1,hh+16);if(sl>=0){ctx.fillStyle=shd(c,1.2);ctx.fillRect(x,base-12-hh,1,2)}}

    const r=hsh(c*31+BK.indexOf(dom)*101);let acc=0;for(const[ty,pr]of props){acc+=pr;if(r<acc){drawPropHD(ctx,ty,x,base-2+Math.round(hsh(c*7)*4),PAL[dom],c);break}}}

}

  r.incCount++;r.segInc=1;SND.crash(ty);if(S._bot)r.spook=Math.min(.45,(r.spook||0)+R(.12,.3));if(!S._bot){r.shake=9;lensSplat(seg.b==='duny'||seg.b==='fesh'?'sand':'mud',RI(2,4))}

  const injure=ch=>{if(rand()<ch){const p=rand()<.6?d:n;if(!p)return;const sk=pick(ROLES[p.role].skills);const pen=RI(2,3);const name=pick(SERIOUS);addInjury(p,{serious:true,name,skill:sk,pen,h:R(20,50)});rlog(`${p.name}: ${name} (${SKILLS[sk]} −${pen}, výdrž −${pen}). Bez doktora se to bude hojit dlouho.`,'bad')}};
  if(ty==='strecha'&&false&&o>.3&&rand()<.12){CK.forEach(k=>dmg(k,8,20));rlog('Strašlivá havárie. Auto je na kusy.','bad');injure(.7);return finishRace('destroyed','Těžká havárie při velkém přestřelení rychlosti.')}

    case 'strecha':dmg('podvozek',3,8);CK.forEach(k=>dmg(k,.5,3));injure(.4);r.incident={type:'strecha',title:'Na střeše!',text:'Auto je vzhůru nohama. Zkusit ho otočit, nebo čekat na pomoc?',helpable:true,help:.22,act:'Zkusit otočit (10 min)',actCh:()=>clamp(.1+.02*eff(d,'technika'),.05,.4),actT:10};break;
  }

  renderIncident();
}

function buy(id){
  const item=S.pool.find(i=>i.id===id);if(!item)return;
  if(S.mp&&S.phase==='shop'&&!S._applyPick){if(!mpMyTurn()||S.mp.passed||item.takenBy)return;if(item.kind==='car'){const refund=S.team.car?S.team.car.price:0;if(item.price>S.money+refund)return}else if(item.price>S.money||item.owned)return;
    mpToHost({t:'pick',pid:NET.pid,id,release:item.kind==='car'&&S.team.car?S.team.car.poolId:null});return}
  if(item.kind==='car'){
    const m=CAR_MODELS.find(x=>x.id===item.model);
    let refund=0;if(S.team.car)refund=S.team.car.price;
    if(item.price>S.money+refund)return;
    if(S.team.car){const old=S.pool.find(i=>i.id===S.team.car.poolId);if(old)old.owned=false}
    S.money+=refund-item.price;const car=makeCar(m);car.price=item.price;car.poolId=item.id;S.team.car=car;item.owned=true;
  }else{
    if(item.price>S.money)return;
    if(item.owned)return;S.money-=item.price;item.owned=true;const p={...item};delete p.kind;delete p.owned;p.poolId=item.id;p.task='rest';S.team.people.push(p);
    if(S.phase==='bivak')log(`${p.name} (${ROLES[p.role].name}) se přidal k týmu.`,'ok');
  }
  if(S.phase==='bivak'){renderShop();renderBivakParts()}else renderShop();
}
function sell(id){const tm=S.team;const p=tm.people.find(x=>x.id===id);if(!p)return;tm.people=tm.people.filter(x=>x!==p);S.money+=p.price;{const it=S.pool.find(i=>i.id===(p.poolId||p.id));if(it)it.owned=false;else if(p.poolItem)S.pool.push({...p.poolItem,owned:false})}if(tm.driverId===id)tm.driverId=null;if(tm.navId===id)tm.navId=null;renderShop()}

function stageFit(st,setup){const sh=biomeShare(st);let s=0;for(const b in sh)s+=sh[b]*setupScore(setup,b);return s/st.km}

function teamRow(T,st){const res=st.res&&st.res[T.id||'me'];
  if(res){if(res.skip)return{state:'skip',km:0};return res.fin?{state:'fin',time:res.time+res.pen,pen:res.pen,km:st.km}:{state:'dnf',km:0}}
  const r=T.id==='me'||!T.id?S.race:T.race;
  if(r&&r.stage===st)return{state:'track',km:r.dist,stopped:r.v<2&&r.countdown<=0};
  return{state:'track',km:0}}
function liveStageRows(st){
  const rows=[];
  if(!S.team.out)rows.push({id:'me',name:S.team.name,...teamRow(S.team,st)});
  for(const b of S.bots){if(b.out&&!(st.res&&st.res[b.id]))continue;rows.push({id:b.id,name:b.name,...teamRow(b,st)})}
  const ord={fin:0,track:1,skip:2,dnf:3};
  rows.sort((a,b)=>ord[a.state]-ord[b.state]||(a.state==='fin'?a.time-b.time:(b.km||0)-(a.km||0)));
  return rows;
}

  else if(view==='stage'){title=`Etapa ${n} · průběžně`;const rows=liveStageRows(st);const best=(rows.find(r=>r.state==='fin')||{}).time;
    table=`<tr><th>#</th><th>Tým</th><th class="r">Čas</th><th class="r">Ztráta</th><th class="r">Penal.</th></tr>`+rows.map((e,i)=>`<tr class="${e.id==='me'?'me':''}"><td>${e.state==='fin'?i+1:''}</td><td>${nameHtml(e.id,e.name)}</td><td class="r num">${e.state==='fin'?dur(e.time):e.state==='track'?`na trati ${Math.round(e.km/st.km*100)} %`:e.state==='skip'?'žolík':'DNF'}</td><td class="r num">${e.state==='fin'&&e.time!==best?'+'+dur(e.time-best):''}</td><td class="r num">${e.pen?e.pen+' min':''}</td></tr>`).join('')}
  else{title=finals.length?`Celkové pořadí po etapě ${finals[finals.length-1].n}`:'Celkové pořadí';const ov=overallTable();const best=ov[0]&&ov[0].t;
    table=finals.length?`<tr><th>#</th><th>Tým</th><th class="r">Celkem</th><th class="r">Ztráta</th></tr>`+ov.map((e,i)=>`<tr class="${e.id==='me'?'me':''}"><td>${e.out?'—':i+1}</td><td>${nameHtml(e.id,e.name)}</td><td class="r num">${e.out?'mimo závod':dur(e.t)}</td><td class="r num">${!e.out&&i?'+'+dur(e.t-best):''}</td></tr>`).join(''):'<tr><td class="mute">Celkové pořadí se počítá, až dojedou všichni z první etapy.</td></tr>'}
  openModal(`<div class="modal"><header><h2>${title}</h2><button data-act="close">Zavřít</button></header>

  <p class="hint" style="margin:0">● = etapa ještě běží, výsledky jsou průběžné.</p>

function showHelp(){
  openModal(`<div class="modal"><header><h2>Příručka</h2><button data-act="close">Zavřít</button></header><div class="prose">
  <h3>Cíl</h3><p>Vyhraje tým s nejnižším součtem časů ze všech etap. Nedojedeš-li etapu, dostaneš čas nejpomalejšího jezdce + 2 hodiny.</p>
  <h3>Bivak</h3><p>Čas běží jen když ho pustíš (1× = 15 s na hodinu, 2×, 3× nebo Dál). Lidi přetahuješ myší mezi stanovišti. Kdo nemá práci, je ve stanu (pravý sloupec) a odpočívá. Vytažením z úkolu kamkoli mimo stanoviště ho pošleš do stanu. Kdo pracuje, unavuje se, a na 0 % může usnout a spí až do 75 %. Energie se doplňuje pomalu, v noci rychleji. Rozhoduj, co stihneš opravit a kdo se musí vyspat.</p>
  <p><b>Skilly v bivaku:</b> každá práce má svůj skill. Se skillem 0 pracuješ zhruba 9× pomaleji než specialista se skillem 10. Kdo má v dané práci skill pod 5, unavuje se navíc rychleji (se skillem 0 o 50 %). <b>Dílna:</b> opravy, upgrady (jen čas, ale hodně: vyšší level = mnohem delší práce, typicky na několik bivaků) a nastavení auta. Víc lidí na jedné práci = rychleji, ale s klesajícím přínosem. <b>Kuchyně:</b> kuchař zvyšuje regeneraci všem, jeho výkon se dělí počtem lidí. <b>Ošetřovna:</b> lékař a pacienti. <b>Štábní stan:</b> předpověď počasí a analýza terénu (meteorolog) a studium roadbooku (navigátor).</p>
  <h3>Přesun bivaku</h3><p>Na většině etap se bivak po startu stěhuje k cíli. Při startu vybereš řidiče konvoje (kohokoliv kromě posádky). Cestou se unavuje, a když je vyčerpaný, zastavuje nebo usne a bivak přijede pozdě. Dokud bivak nedorazí, na autě se nedá pracovat. Ostatní během přesunu skoro neregenerují. Okruhové etapy se nestěhují.</p><h3>Zranění</h3><p>Posádka je po každé etapě rozlámaná (drobné zranění, hlavně po kamenech a dunách). Drobné zranění nesnižuje skilly, ale zpomaluje regeneraci, práci a v závodě víc unavuje. Hojí se jen při odpočinku. Když se neléčí, další etapa ho zhorší (až 3/3 = chronické, pak i výdrž −1). Nehody můžou způsobit vážné zranění, které bez doktora léčí jen pomalu. Pošli zraněné do ošetřovny jako pacienty.</p><h3>Trvalé opotřebení</h3><p>Každé ničení dílu trochu sníží jeho maximum, na které ho jde opravit (šrafovaná část). Nejvíc ho ničí rychlá jízda nad bezpečnou hranicí a nehody. Upgrade zvedne maximum o 10 % aktuální hodnoty (z 80 % na 88 %), takže díl úplně neomladí.</p><h3>Pneumatiky a počasí</h3><p>Máš sadu suchých a sadu mokrých pneumatik. Suché v dešti znamenají horší grip, nižší bezpečnou rychlost a vyšší riziko. Mokré na suchu se rychle ničí a auto je pomalejší. Přezutí trvá hodinu práce. Bez předpovědi vidíš jen široký odhad deště. Každá předpověď meteorologa ho zúží a třetí dá jistotu.</p><h3>Etapa</h3><p>45 sekund = 1 herní hodina. Kromě rychlosti hlídej teplotu motoru (nad 105 °C se ničí). Režim motoru Útok dá o 7 % rychlejší tempo bez změny rychlostního pásu, ale hřeje a ničí motor. Topení naplno motor rychle chladí, ale vyčerpává posádku. Na etapu máš 3 lahve vody: zastávka na 3 minuty dá oběma jezdcům +14 % energie (unaveným +18 %). Vyplatí se, když zbývá ještě hodně etapy nebo je posádka vyčerpaná. Auto nezrychluje ani nebrzdí okamžitě: záleží na převodovce, jezdci a stavu pneumatik. Sleduj, kdy přijde další biom, a zpomal včas. Riziko se počítá z aktuální rychlosti, ne z posuvníku. Špatné nastavení pro daný biom zvyšuje riziko nehody a víc unavuje jezdce. Rychlost nastavuješ posuvníkem. Oranžový pás ukazuje, kde zhruba leží hranice bezpečné rychlosti. Ta zahrnuje auto, opotřebení dílů, nastavení, skilly a únavu posádky, počasí i noc. Pod pásem jsi v bezpečí, v pásu možná riskuješ, nad ním určitě. Postřeh jezdce může chybu na poslední chvíli zachránit. Lepší posádka = užší pás.</p>
  <h3>Biomy</h3>${BK.map(b=>`<p><b style="color:${BIOMES[b].ui}">${BIOMES[b].name}</b>: ${BIOMES[b].info} Vyniká: ${BIOMES[b].good} Riziko: ${BIOMES[b].risk}</p>`).join('')}
  <h3>Díly</h3><p>Díly mají kvalitu Q1–10 a stav 0–100 %. Pneumatiky kvalitu nemají, jen se opotřebují a vyměňují. Pod 25 % hrozí, že díl praskne a etapu nedojedeš.</p>
  <h3>Waypointy a zkušenosti</h3><p>Na trati je 15 waypointů, nenalezený stojí 15 minut. Lidé se učí z chyb: první chyba dá 100 XP, každá další o 10 % méně. Na další level je potřeba 100 + 100 × level XP.</p>
  <h3>Maraton a den volna</h3><p>Po první části maratonu spíte bez týmu, opravovat můžou jen jezdec a navigátor. Den volna je celý den na opravy a regeneraci a otevře se trh. Když etapu nedojedeš, odtáhnou tě do bivaku a pokračuješ dál s časem nejpomalejšího + 2 h.</p><h3>V závodě</h3><p>Rychlost řídíš sliderem (šipky). Agresivita (Q/E) posune oranžový pás doprava: jedeš rychleji, ale víc ničíš pneumatiky a motor se víc hřeje. Topení chladí motor, ale vyčerpává posádku.</p><h3>Hráči</h3><p>Etapa startuje, až jsou připravení všichni hráči. Panel Hráči vlevo dole ukazuje, kdo je ještě na trati a kolik mu zbývá do startu.</p></div></div>`);
}

function netSend(m){if(NET.send)try{NET.send(m)}catch(e){}}
function netOn(m){
  if(m&&m.t==='chunk'){const c=NET.chunks[m.id]=NET.chunks[m.id]||{n:m.n,p:[]};c.p[m.i]=m.d;if(c.p.filter(x=>x!=null).length<c.n)return;delete NET.chunks[m.id];m=JSON.parse(c.p.join(''))}
  if(!m||(m.to&&m.to!==NET.pid))return;
  try{mpHandle(m)}catch(e){console.error(e)}
}
const isHost=()=>!!(S&&S.mp&&S.mp.host);
function mpToHost(m){if(isHost())mpHandle(m);else netSend(m)}
function newCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function myPlayer(){return{pid:NET.pid,team:S.settings.teamName,number:S.settings.number,colors:S.settings.colors}}
async function mpHost(){
  readSetupInputs();const code=newCode();
  S.mp={host:true,code,pid:NET.pid,players:[{...myPlayer(),col:PCOLS[0],host:true}]};S.phase='lobby';render();
  try{await netConnect(code);S.mp.ok=true}catch(e){S.mp.err=e.message}render();
}
async function mpJoin(){
  readSetupInputs();const el=document.getElementById('joinCode');const code=(el&&el.value||'').trim().toUpperCase();if(code.length<4){toastMsg('Zadej kód hry.');return}
  S.mp={host:false,code,pid:NET.pid,players:[]};S.phase='lobby';render();
  try{await netConnect(code);S.mp.ok=true;netSend({t:'hello',...myPlayer()})}catch(e){S.mp.err=e.message}render();
}
async function mpReconnect(){
  if(!S.mp)return;NET.pid=S.mp.pid;try{await netConnect(S.mp.code);S.mp.ok=true;S.mp.err=null;if(!S.mp.host)netSend({t:'hello',...myPlayer(),resume:true});log(`Znovu připojeno k online hře ${S.mp.code}.`,'ok')}catch(e){S.mp.err=e.message;log('Online připojení selhalo: '+e.message,'bad')}
}
function mpLeave(){netClose();S={...defaults(),settings:S.settings};S.phase='menu';render()}
function mpLobbyBroadcast(){netSend({t:'lobby',players:S.mp.players,settings:{budget:S.settings.budget,days:S.settings.days,len:S.settings.len}})}
function stubOf(b){return{id:b.id,name:b.name,number:b.number,livery:b.livery,car:{shape:(b.car&&b.car.shape)||'suv'},isRemote:true,human:!!b.human,state:'bivak',out:!!b.out,race:null}}
function playerStub(pl){return{id:pl.pid,name:pl.team,number:pl.number,livery:pl.colors,car:{shape:'suv'},isRemote:true,human:true,state:'bivak',out:false,race:null}}
function mpStartDraft(){
  readSetupInputs();const mp=S.mp;const players=mp.players;S.settings.players=players.length;S.settings.noHumans=true;
  newGame();S.mp=mp;
  S.bots=S.bots.slice(0,Math.max(0,30-players.length));S.overall={me:0};S.bots.forEach(b=>S.overall[b.id]=0);
  for(const pl of players)if(pl.pid!==NET.pid){S.bots.push(playerStub(pl));S.overall[pl.pid]=0}
  S.humans=players.filter(p=>p.pid!==NET.pid).map(p=>({id:p.pid,nick:p.team,col:p.col,real:true}));
  mp.draft={order:shuffle(players.map(p=>p.pid)),pos:0,dir:1,passed:[],taken:{}};
  const host=players.find(p=>p.pid===NET.pid);
  netSend({t:'init',settings:{budget:S.settings.budget,days:S.settings.days,len:S.settings.len},stages:S.stages,restDay:S.restDay,lastDay:S.lastDay,pool:S.pool,
    teams:S.bots.map(b=>b.isRemote?b:stubOf(b)).concat([playerStub(host)]),players,draft:mp.draft});
  render();
}
function mpBuildClient(m){
  const set=S.settings;Object.assign(set,m.settings);set.noHumans=true;set.players=m.players.length;const mp=S.mp;
  S={settings:set,phase:'shop',t:900,speed:0,money:set.budget,log:[],
    team:{id:'me',name:set.teamName,car:null,people:[],driverId:null,navId:null,spares:1,joker:1,out:false,prep:{}},
    pool:m.pool,bots:m.teams.filter(t=>t.id!==NET.pid),stages:m.stages,restDay:m.restDay,lastDay:m.lastDay,stageIdx:0,jobs:[],setupProg:0,overall:{me:0},race:null,
    marathonNight:false,restPoolDone:false,unseenResults:null,skipNext:false,shopTab:'car',selId:null,mp};
  S.bots.forEach(b=>S.overall[b.id]=0);mp.players=m.players;mp.draft=m.draft;
  S.humans=m.players.filter(p=>p.pid!==NET.pid).map(p=>({id:p.pid,nick:p.team,col:p.col,real:true}));
  UID=Math.max(UID,1000+Math.max(0,...S.pool.map(p=>p.id)));
  log('Přílet do bivaku. Začíná draft týmů.');render();
}
/* --- draft --- */
const mpTurn=()=>S.mp&&S.mp.draft?S.mp.draft.order[S.mp.draft.pos]:null;
const mpMyTurn=()=>!S.mp||mpTurn()===NET.pid;
function mpPlayerName(pid){const p=S.mp&&S.mp.players.find(x=>x.pid===pid);return p?p.team:'?'}
function mpPlayerCol(pid){const p=S.mp&&S.mp.players.find(x=>x.pid===pid);return p?p.col:'#ccc'}
function draftAdvance(){const d=S.mp.draft;const n=d.order.length;if(d.passed.length>=n)return mpBegin();
  for(let g=0;g<2*n+2;g++){let np=d.pos+d.dir;if(np>=n||np<0){d.dir*=-1;np=d.pos}d.pos=np;if(!d.passed.includes(d.order[d.pos]))break}}
function mpPick(m){const d=S.mp.draft;if(!d||mpTurn()!==m.pid)return;const item=S.pool.find(i=>i.id===m.id);
  if(!item||(!item.free&&d.taken[m.id])){netSend({t:'pickfail',to:m.pid});return}
  if(!item.free)d.taken[m.id]=m.pid;if(m.release!=null&&d.taken[m.release]===m.pid)delete d.taken[m.release];
  draftAdvance();if(S.phase!=='shop')return;const msg={t:'picked',pid:m.pid,id:m.id,draft:d};netSend(msg);mpApplyPicked(msg)}
function mpApplyPicked(m){S.mp.draft=m.draft;mpApplyTaken();if(m.pid===NET.pid){S._applyPick=true;buy(m.id);S._applyPick=false}else if(S.phase==='shop')renderShop();SND.click&&SND.click()}
function mpApplyTaken(){const tk=S.mp.draft.taken;for(const it of S.pool)it.takenBy=tk[it.id]&&tk[it.id]!==NET.pid?tk[it.id]:null}
function mpPass(pid){const d=S.mp.draft;if(!d.passed.includes(pid))d.passed.push(pid);if(d.passed.length>=d.order.length){mpBegin();return}if(mpTurn()===pid)draftAdvance();const msg={t:'draft',draft:d};netSend(msg);mpHandle(msg)}
function mpBegin(){netSend({t:'begin'});goBivak()}
/* --- in game --- */
function mpStatus(){return{t:'st',pid:NET.pid,team:S.team.name,phase:S.phase,stageIdx:S.stageIdx,clock:S.t,speed:modalOpen?0:S.speed,ready:!!S.waitHumans,dist:S.race?Math.round(S.race.dist*10)/10:0,v:S.race?Math.round(S.race.v):0,out:!!S.team.out,passed:!!S.mp.passed}}
function mpOnStatus(m){NET.status[m.pid]={...m,at:performance.now()};
  const h=S.humans&&S.humans.find(x=>x.id===m.pid);if(h){h.clock=m.clock;h.speed=m.speed;h.ready=m.ready}
  const b=S.bots&&S.bots.find(x=>x.id===m.pid);if(b){b.out=m.out;if(m.phase==='race'&&S.stages[m.stageIdx]){b.state='race';b.race={dist:m.dist,v:m.v,countdown:0,stage:S.stages[m.stageIdx]}}else{b.state='bivak';b.race=null}}}
function mpSnap(){
  const res={};for(const st of S.stages)if(st.started&&!st.final&&st.res){const o={};for(const k in st.res)o[k==='me'?NET.pid:k]=st.res[k];res[st.n]=o}
  netSend({t:'snap',teams:S.bots.filter(b=>!b.isRemote).map(b=>({id:b.id,state:b.state,out:b.out,dist:b.race?Math.round(b.race.dist*10)/10:0,v:b.race?Math.round(b.race.v):0,si:b.race?b.race.stage.n:0})),res})}
function mpApplySnap(m){
  for(const x of m.teams){const b=S.bots.find(y=>y.id===x.id);if(!b)continue;b.out=x.out;if(x.state==='race'&&x.si){b.state='race';b.race={dist:x.dist,v:x.v,countdown:0,stage:S.stages[x.si-1]}}else{b.state='bivak';b.race=null}}
  for(const n in m.res){const st=S.stages[n-1];if(!st||st.final)continue;st.res=st.res||{};st.started=true;for(const id in m.res[n])if(id!==NET.pid)st.res[id]=m.res[n][id]}
}
function mpBroadcastFinal(st){const mo=x=>x==='me'?NET.pid:x;const ov={};for(const k in S.overall)ov[mo(k)]=S.overall[k];
  netSend({t:'final',n:st.n,table:st.table.map(e=>({...e,id:mo(e.id)})),overall:ov})}
function mpApplyFinal(m){const st=S.stages[m.n-1];if(!st||st.final)return;const mi=x=>x===NET.pid?'me':x;
  st.table=m.table.map(e=>({...e,id:mi(e.id),name:e.id===NET.pid?S.team.name:e.name}));S.overall={};for(const k in m.overall)S.overall[mi(k)]=m.overall[k];
  st.final=true;st.started=true;S.unseenResults=st.n;S.pendingRes=st.n;const me=st.table.findIndex(e=>e.id==='me');
  log(`Konečné výsledky etapy ${st.n}: ${me>=0?(me+1)+'. místo':'mimo závod'}.`,'ok');
  if(st.n===S.stages.length){S.phase='end';clearSave();render();showResults(st.n,'overall')}else if(S.phase==='bivak')renderBivakParts()}
function mpResync(pid){for(const st of S.stages)if(st.final){const mo=x=>x==='me'?NET.pid:x;const ov={};for(const k in S.overall)ov[mo(k)]=S.overall[k];netSend({t:'final',to:pid,n:st.n,table:st.table.map(e=>({...e,id:mo(e.id)})),overall:ov})}mpSnap()}
function mpBeginStage(){const nx=nextStageObj();if(isHost()&&nx)netSend({t:'go',n:nx.n});S.waitHumans=false;startStage()}
function mpTick(dt){
  if(!S.mp||!NET.send)return;
  NET.stAcc+=dt;if(NET.stAcc>1){NET.stAcc=0;if(S.phase==='bivak'||S.phase==='race'||S.phase==='shop')netSend(mpStatus())}
  if(isHost()){NET.snapAcc+=dt;if(NET.snapAcc>1.5&&(S.phase==='bivak'||S.phase==='race')){NET.snapAcc=0;mpSnap()}}
}
function mpHandle(m){
  switch(m.t){
    case 'hello':{if(!isHost())return;let pl=S.mp.players.find(p=>p.pid===m.pid);
      if(!pl){if(S.phase!=='lobby'||S.mp.players.length>=10){netSend({t:'full',to:m.pid,why:S.phase!=='lobby'?'Hra už běží.':'Hra je plná (10 hráčů).'});return}
        pl={pid:m.pid,team:m.team,number:m.number,colors:m.colors,col:PCOLS[S.mp.players.length%PCOLS.length]};S.mp.players.push(pl)}
      else if(S.phase==='lobby')Object.assign(pl,{team:m.team,number:m.number,colors:m.colors});
      if(S.phase==='lobby'){mpLobbyBroadcast();render()}else{mpResync(m.pid);const b=S.bots.find(x=>x.id===m.pid);if(b)b.out=false;log(`${pl.team} se znovu připojil.`,'ok')}
      break}
    case 'lobby':if(isHost())return;S.mp.players=m.players;S.mp.settings=m.settings;if(S.phase==='lobby')render();break;
    case 'full':S.mp.err=m.why;netClose();render();break;
    case 'init':if(isHost()||S.phase!=='lobby')return;mpBuildClient(m);break;
    case 'pick':if(isHost())mpPick(m);break;
    case 'picked':if(!isHost())mpApplyPicked(m);break;
    case 'pickfail':toastMsg('Kartu už někdo vzal.');break;
    case 'pass':if(isHost())mpPass(m.pid);break;
    case 'draft':S.mp.draft=m.draft;mpApplyTaken();if(S.phase==='shop')renderShop();break;
    case 'begin':if(!isHost()&&S.phase==='shop')goBivak();break;
    case 'st':mpOnStatus(m);break;
    case 'res':if(!isHost())return;{const st=S.stages[m.n-1];if(!st)return;st.res=st.res||{};st.res[m.pid]=m.res;st.started=true;checkResults()}break;
    case 'snap':if(!isHost())mpApplySnap(m);break;
    case 'final':if(!isHost())mpApplyFinal(m);break;
    case 'go':if(isHost())return;{const nx=nextStageObj();if(S.phase==='bivak'&&nx&&nx.n===m.n){if(S.awaitMover||modalKind==='mover'){S.mp.goPending=m.n;return}S.waitHumans=false;startStage()}}break;
    case 'kick':if(m.pid===NET.pid){S.team.out=true;log('Hostitel tě odpojil ze hry.','bad')}else{const b=S.bots.find(x=>x.id===m.pid);if(b)b.out=true}break;
  }
}
function mpKick(pid){const b=S.bots.find(x=>x.id===pid);if(b)b.out=true;netSend({t:'kick',pid});log(`${mpPlayerName(pid)} vyřazen (odpojený hráč).`,'warn');checkResults()}
function renderLobby(){
  const mp=S.mp;const host=mp.host;const set=host?S.settings:(mp.settings||{});
  const dl={short:'7 etap',std:'13 etap',long:'15 etap'}[set.days]||'—',ll={short:'kratší',classic:'klasika',long:'delší'}[set.len]||'—';
  app.innerHTML=`<div class="lobby-wrap"><div class="panel lobby">
    <div class="row" style="justify-content:space-between"><h2>${ic('users')} Online hra</h2><button class="small" data-act="mpLeave">Odejít</button></div>
    ${mp.err?`<div class="banner" style="color:var(--bad)">${esc(mp.err)}</div>`:mp.ok?'':'<p class="hint">Připojuji…</p>'}
    <div class="codebox"><span>KÓD HRY</span><b class="num">${esc(mp.code)}</b>${host?'<button class="small" data-act="copyCode">Kopírovat</button>':''}</div>
    <p class="hint">${host?'Pošli kód kamarádům. Připojí se přes Multiplayer → Připojit. Maximálně 10 hráčů, zbytek pole doplní boti do 30 týmů.':'Jsi připojený. Čekáme, až hostitel spustí draft.'}</p>
    <div class="plist">${(mp.players||[]).map(p=>`<div class="pl"><i style="background:${p.col}"></i><span class="pn"><b style="color:${p.col}">${esc(p.team)}</b> <span class="mute">#${p.number}</span></span><span class="ps">${p.host?'hostitel':''}${p.pid===NET.pid?' · ty':''}</span></div>`).join('')||'<span class="hint">Zatím nikdo.</span>'}</div>
    <div class="row" style="gap:8px"><span class="pill">${money(set.budget||0)}</span><span class="pill">${dl}</span><span class="pill">etapy: ${ll}</span><span class="pill">${30-(mp.players||[]).length} botů</span></div>
    ${host?`<button class="primary" style="font-size:18px;padding:9px" data-act="mpStart" ${mp.ok?'':'disabled'}>Spustit draft →</button>`:''}
  </div></div>`;
}
/* --- ukládání do souboru --- */
function saveToFile(){
  try{const data=JSON.stringify({game:'desert-fever',v:VERSION,S});const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');
    const d=new Date();a.href=URL.createObjectURL(blob);a.download=`desert-fever-${S.team?S.team.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase():'hra'}-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toastMsg('Hra uložená do souboru.')}catch(e){toastMsg('Uložení se nepovedlo.')}
}
function loadFromFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);const s=o.S||o;if(!s.team||!s.stages)throw 0;
    S=migrateSave(s);UID=Math.max(UID,1+Math.max(0,...S.team.people.map(p=>p.id),...S.pool.map(p=>p.id),...S.bots.flatMap(b=>(b.people||[]).map(p=>p.id))));
    if(S.phase==='race'){S.phase='bivak';S.race=null}S.speed=0;S.waitHumans=false;if(S.mp)mpReconnect();save();render();toastMsg('Hra načtená.')}catch(e){toastMsg('Tohle není uložená hra Desert Fever.')}};rd.readAsText(f)};inp.click()}
function toastMsg(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2600)}

let plAcc=0;
let last=performance.now(),bivAcc=0,renderAcc=0,saveAcc=0;
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  humansTick(dt);mpTick(dt);plAcc+=dt;if(plAcc>.4){plAcc=0;renderPlayers()}
  if(S.phase==='bivak'){
    S.resClock=Math.max(S.resClock||0,S.t)+((S.speed===0||modalOpen)?dt*4:0);
    if(S.speed>0&&!modalOpen){bivAcc+=dt*4*S.speed;while(bivAcc>=1&&S.phase==='bivak'){bivAcc-=1;bivakStep(1)}}
    else bivAcc=0;
    if(S.phase==='bivak'){
      {const nx=nextStageObj();let W=Math.max(S.t,S.resClock||0);if(nx)W=Math.min(W,nx.start);botsAdvance(W);if(S.speed===0||modalOpen)checkResults()}
      const cv=document.getElementById('bivakScene');if(cv)renderBivakScene(cv);
      const ck=document.getElementById('clk');if(ck)ck.textContent=clock(S.t);
      const sl=document.getElementById('startLeft');const nx=nextStageObj();if(sl&&nx)sl.textContent=durHM(nx.dep-S.t);
      renderAcc+=dt;if(renderAcc>.5&&S.speed>0&&!modalOpen&&!dragging){renderAcc=0;renderBivakParts()}
      saveAcc+=dt;if(saveAcc>5){saveAcc=0;save()}
      if(S.waitHumans&&(!S.mp||isHost())){const nx=nextStageObj();if(!nx||humansReady(nx)){log('Všichni hráči jsou připraveni. Start!','ok');mpBeginStage()}}
      if(S.mp&&S.mp.goPending&&!S.awaitMover&&modalKind!=='mover'&&S.phase==='bivak'){const n=S.mp.goPending;S.mp.goPending=null;const nx=nextStageObj();if(nx&&nx.n===n){S.waitHumans=false;startStage()}}
    if(S.phase==='bivak'&&S.pendingRes&&!modalOpen&&!dragging&&!S.awaitMover&&!S.waitHumans){const n=S.pendingRes;S.pendingRes=null;S.speed=0;showResults(n,'stage')}
    }
  }else if(S.phase==='menu'){const cv=document.getElementById('menuScene');if(cv)renderMenuScene(cv,dt);
  }else if(S.phase==='race'&&S.race){
    if(!S.race.over)raceStep(dt);
    if(S.race)botsAdvance(S.race.t);
    if(S.race&&S.race.over&&S.race.finAnim>0){const r=S.race;r.finAnim-=dt;r.v=Math.max(0,r.v-r.v*dt*1.2-8*dt);r.dist+=r.v*dt*RACE_GMIN_PER_S/60;if(r.finAnim<=0)showFinishModal()}
    const cv=document.getElementById('scene');if(cv&&S.race)renderRaceScene(cv,dt);
    if(S.race){updateRaceUI(false);const inc=S.race.incident;
      if(inc&&!inc._shown){inc._shown=true;renderIncident()}
      if(!inc){const el=document.getElementById('incident');if(el&&!el.hidden)el.hidden=true}
      else if(inc.busy===null&&inc._busyShown){inc._busyShown=false;renderIncident()}
      if(inc&&inc.busy&&!inc._busyShown){inc._busyShown=true;renderIncident()}}
  }
  requestAnimationFrame(loop);
}
S=defaults();
render();
requestAnimationFrame(loop);
</script>
