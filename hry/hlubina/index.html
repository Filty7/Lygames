<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hlubina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: celoobrazovkový výhled do opuštěné laboratoře; laboratorní karty vykukují shora, dole lišta info | posádka | akce */
:root{
  --bg:#07060a; --ink:#e6e1ec; --muted:#8a8494; --dim:#5b5664;
  --panel:rgba(13,11,17,.9); --panel2:#17141d; --line:#2e2936;
  --lamp:#ffcf6b; --lampdim:#7d6430; --rad:#8cff5a; --ghost:#a46bff; --bad:#ff5050; --good:#6dffb0;
  --ex:#ff9a3c; --water:#3f7fa3; --gold:#e8c25a; --paper:#d9d1bd; --paperink:#2a2520;
  --display:'Chakra Petch','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif; --serif:'IBM Plex Serif',Georgia,serif;
  --cs:96px; --barh:122px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:13.5px;line-height:1.4;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.02em}

#app{position:fixed;inset:0}
#view{position:absolute;left:0;right:0;top:0;bottom:var(--barh);overflow:hidden;touch-action:none;cursor:grab;user-select:none;
  background:radial-gradient(ellipse at 50% 35%,rgba(40,34,48,.55),transparent 75%),
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.025) 0 1px,transparent 1.5px) 0 0/23px 19px,
    radial-gradient(circle at 70% 60%,rgba(0,0,0,.35) 0 1px,transparent 2px) 0 0/31px 27px,
    linear-gradient(160deg,#121016,#0c0b10 60%,#08070b)}
#view.drag{cursor:grabbing}
#view.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
#view.shake2{animation:shake2 .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-1px,0)}20%,80%{transform:translate(3px,-1px)}30%,50%,70%{transform:translate(-4px,2px)}40%,60%{transform:translate(4px,-1px)}}
@keyframes shake2{25%{transform:translate(0,2px)}50%{transform:translate(-1px,-1px)}75%{transform:translate(1px,1px)}}
#board{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#board.smooth{transition:transform .5s cubic-bezier(.3,.7,.3,1)}#board.smooth.slowpan{transition:transform 1.6s cubic-bezier(.45,.05,.3,1)}
.layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#cells{position:absolute;left:0;top:0;display:grid;grid-auto-rows:var(--cs);z-index:1}
.cell{position:relative;width:var(--cs);height:var(--cs)}
.cell img,.gcell img,.mini img{display:block;width:100%;height:100%;image-rendering:pixelated}
.cell.dark{background:rgba(10,9,13,.7);box-shadow:inset 0 0 0 1px rgba(170,160,200,.065),inset 0 0 18px rgba(0,0,0,.45)}
.cell.dark::after{content:"";display:none;position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-left:1px solid rgba(170,160,200,.14);border-top:1px solid rgba(170,160,200,.14);transform:rotate(45deg) translate(2px,2px);opacity:.7}
.cell.dark::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(170,160,200,.16) 0 1px,transparent 1.5px) 0 0/48px 48px;background-position:-24px -24px}
.cell.zone{box-shadow:inset 0 0 0 1px rgba(110,255,170,.22),inset 0 0 26px rgba(80,220,140,.12)}
.cell.zone::before{content:"";position:absolute;inset:38%;border:1px dashed rgba(110,255,170,.25);border-radius:50%;animation:zp 3s ease-in-out infinite}
@keyframes zp{50%{transform:scale(1.25);opacity:.4}}
.cell.slam{animation:slam .42s cubic-bezier(.55,0,.6,1.25) both;z-index:3}
@keyframes slam{0%{transform:translateY(-26%) scale(1.14);opacity:0;filter:brightness(1.8)}55%{transform:translateY(2%) scale(.985);opacity:1;filter:brightness(1.2)}100%{transform:none;filter:none}}
.cell.emerge{animation:emerge .5s cubic-bezier(.4,0,.5,1.2) both}
@keyframes emerge{0%{opacity:0;transform:translateY(-10%) scale(1.05);filter:brightness(2.2)}70%{opacity:1}100%{opacity:1;transform:none;filter:none}}
.cell.ghost{z-index:20;overflow:visible}
.cell.ghost::before{content:"";position:absolute;inset:14% 8% -6%;background:radial-gradient(ellipse at 50% 80%,#000d,transparent 70%);filter:blur(5px)}
.gfloat{position:absolute;inset:0;outline:2px dashed rgba(255,207,107,.75);outline-offset:-1px;box-shadow:0 22px 26px -8px #000e;animation:hover 1.6s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(-10px) scale(1.04)}50%{transform:translateY(-15px) scale(1.05)}}
#gutL,#gutR{position:absolute;top:0;width:calc(var(--cs)/2);height:100%;overflow:hidden;pointer-events:none;opacity:.62;z-index:1;filter:saturate(.6)}
#board::before,#board::after{content:"";position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed rgba(232,211,168,.28);z-index:12;pointer-events:none}
#board::before{left:-1px}#board::after{right:-1px}
.wrapar{position:absolute;width:22px;height:22px;margin-top:-11px;display:flex;align-items:center;justify-content:center;font-size:15px;color:rgba(232,211,168,.55);z-index:12;pointer-events:none;font-family:var(--display)}
#gutL{left:calc(var(--cs)/-2);-webkit-mask-image:linear-gradient(to right,transparent,#000 70%);mask-image:linear-gradient(to right,transparent,#000 70%)}
#gutR{right:calc(var(--cs)/-2);-webkit-mask-image:linear-gradient(to left,transparent,#000 70%);mask-image:linear-gradient(to left,transparent,#000 70%)}
.gcell{position:absolute;width:var(--cs);height:var(--cs)}
.gcell.dk{background:rgba(20,18,26,.55);box-shadow:inset 0 0 0 1px rgba(170,160,200,.09)}

#ladders{z-index:2}#ladfront{z-index:8;opacity:.92}#ropes{z-index:3}#water{z-index:4}#dark{z-index:5}#glows{z-index:6}#mons{z-index:7}#tokens{z-index:8}#marks{z-index:9}#fx{z-index:10}#depth{z-index:11}
.lad{position:absolute;width:28px;background-repeat:repeat-y;background-size:28px 12px;image-rendering:pixelated}
.lad.behind{opacity:.38}
.lad.gup{animation:ladup .45s ease-out both}.lad.gdn{animation:laddn .45s ease-out both}
@keyframes ladup{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes laddn{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.rope{position:absolute;width:6px;background-repeat:repeat-y;background-size:6px 8px;image-rendering:pixelated}
.rope::before{content:"";position:absolute;top:-6px;left:-5px;width:16px;height:8px;background:linear-gradient(#9da2a8,#5d6268);clip-path:polygon(0 0,100% 0,80% 100%,60% 40%,40% 40%,20% 100%)}
.ropeanim{z-index:2}
.ropelbl{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-size:17px;padding:1px 8px;background:#000c;border:1px solid;white-space:nowrap;animation:popc .2s ease-out}
.ropelbl.ok{color:var(--good);border-color:var(--good)}.ropelbl.no{color:var(--bad);border-color:var(--bad)}
.hookfly{position:absolute;left:0;top:0;width:10px;height:10px;background:#c9ced4;box-shadow:0 0 6px #fff8;transition:transform .4s cubic-bezier(.3,.6,.4,1)}

#water{position:absolute;left:-48px;right:-48px;bottom:0;pointer-events:none;transition:top .9s ease-in-out;
  background:linear-gradient(to bottom,rgba(70,120,150,.12),rgba(40,80,105,.17) 60%,rgba(20,45,60,.24));border-top:2px solid rgba(160,210,230,.55);box-shadow:inset 0 2px 10px rgba(160,210,230,.15)}
#water::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;
  background:linear-gradient(90deg,transparent 0 10px,rgba(150,200,215,.55) 10px 16px,transparent 16px 26px,rgba(150,200,215,.35) 26px 30px,transparent 30px) 0 0/36px 6px repeat-x;
  clip-path:polygon(0 100%,0 60%,100% 30%,100% 100%);animation:wave 2.6s linear infinite}
#water::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(160,210,230,.035) 0 2px,transparent 2px 22px),repeating-linear-gradient(65deg,rgba(160,210,230,.03) 0 2px,transparent 2px 30px);animation:caust 9s linear infinite}
@keyframes wave{to{background-position:36px 0}}
@keyframes caust{to{background-position:120px 40px,-80px 60px}}
#dark{position:absolute;left:0;top:0;pointer-events:none}

.gl{position:absolute;width:var(--cs);height:var(--cs);pointer-events:none}
.gl.rad{background:radial-gradient(ellipse at 62% 74%,rgba(140,255,90,.45),rgba(140,255,90,.12) 45%,transparent 70%);mix-blend-mode:screen;animation:radg 2.2s ease-in-out infinite alternate}
@keyframes radg{from{opacity:.55}to{opacity:1}}
.gl.rad i{position:absolute;width:4px;height:4px;background:var(--rad);box-shadow:0 0 6px var(--rad);animation:radp 2.6s linear infinite;opacity:0}
@keyframes radp{0%{transform:translateY(0);opacity:0}25%{opacity:.9}100%{transform:translateY(-34px);opacity:0}}
.gl.lair{background:radial-gradient(ellipse at 42% 42%,rgba(164,107,255,.6),rgba(120,60,220,.18) 35%,transparent 62%);mix-blend-mode:screen;animation:lairg 2.8s ease-in-out infinite}
@keyframes lairg{50%{opacity:.5;transform:scale(.95)}}
.gl.idol{background:radial-gradient(circle at 78% 58%,rgba(255,236,170,.75),rgba(255,210,120,.2) 20%,transparent 38%);mix-blend-mode:screen;animation:idolg 1.8s ease-in-out infinite}
@keyframes idolg{50%{opacity:.6}}
.gl.idol::after{content:"";position:absolute;left:76%;top:42%;width:6px;height:6px;background:#fff6d0;box-shadow:0 0 10px 3px #ffe9a0;animation:twk 2.4s linear infinite}
@keyframes twk{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.gl.portal{background:radial-gradient(circle at 50% 42%,rgba(90,220,200,.2),transparent 40%);mix-blend-mode:screen;animation:pflick 3s steps(6) infinite}
@keyframes pflick{0%,100%{opacity:.5}30%{opacity:.9}55%{opacity:.35}}
.gl.portal.on{background:radial-gradient(circle at 50% 42%,rgba(120,255,233,.85),rgba(80,200,255,.25) 26%,transparent 46%);animation:none}
.gl.portal.on::before{content:"";position:absolute;left:50%;top:42%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:conic-gradient(from 0deg,#7fffe9,#2a6cff,#b07bff,#7fffe9,#2a6cff,#7fffe9);filter:blur(1px);animation:vortex 1.4s linear infinite;mask-image:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes vortex{to{transform:rotate(360deg)}}
.gl.lever{background:radial-gradient(circle at 50% 22%,rgba(170,90,255,.7),rgba(120,60,220,.18) 22%,transparent 42%);mix-blend-mode:screen;animation:lairg 1.6s ease-in-out infinite}
.gl.lever.on{background:radial-gradient(circle at 50% 22%,rgba(127,255,233,.9),rgba(80,200,255,.2) 24%,transparent 44%)}
.gl.start{background:radial-gradient(circle at 50% 42%,rgba(255,150,80,.12),transparent 34%);mix-blend-mode:screen}
.gl.fire{mix-blend-mode:normal}
.gl.fire .fglow{position:absolute;top:10px;bottom:10px;background:radial-gradient(ellipse 60% 70% at 50% 72%,rgba(255,110,30,.4),rgba(255,90,20,.12) 55%,transparent 75%);mix-blend-mode:screen;animation:fglow .35s steps(2) infinite alternate;pointer-events:none}
@keyframes fglow{to{opacity:.7}}
.gl.fire .fl{position:absolute;width:16px;height:24px;background-size:64px 24px;image-rendering:pixelated;animation:flame .48s steps(4) infinite}
@keyframes flame{to{background-position:-64px 0}}
.gl.fire.grow .fl{animation:flame .48s steps(4) infinite,fgrow .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes fgrow{from{transform:scale(.1,0);opacity:0}to{transform:none;opacity:1}}
.gl .fb,#badges .fb{position:absolute;width:18px;height:18px;pointer-events:auto;cursor:help;background:#2a120a;border:1.5px solid #ff6a2a;z-index:1;display:flex;align-items:center;justify-content:center}
#badges{z-index:9}#badges .fb svg{width:12px;height:12px}
#badges .fb em{display:none;position:absolute;left:22px;top:-1px;white-space:nowrap;font-style:normal;font-family:var(--display);font-size:11px;font-weight:600;background:#0d0b11ee;border:1px solid var(--line);padding:1px 6px;color:var(--ink);pointer-events:none;z-index:3}
#badges .fb:hover em{display:block}
#badges .fb.tp{background:#2a1608;border-color:#ff8a2a}#badges .fb.qr{background:#221d0c;border-color:#e0b52a}#badges .fb.sp{background:#0c221c;border-color:#5ff0c0}
.act.org{border-color:#a8581a;color:#ffb070}.act.org:hover:not(:disabled){border-color:#ff8a2a;color:#ffcf6b}
#badges .fb.rd{background:#0f1f0a;border-color:#8cff5a}#badges .fb.lr{background:#1a0d26;border-color:#a46bff}#badges .fb.cv{background:#1f1813;border-color:#b39b80}
.gl.rad.surge{animation:radsurge .45s ease-in-out 7 alternate}
@keyframes radsurge{from{opacity:.6;filter:brightness(1)}to{opacity:1;filter:brightness(2.2) saturate(1.4)}}

.mon{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);transition:transform 1.4s cubic-bezier(.45,.05,.55,.95)}
.mon canvas{width:100%;height:100%;image-rendering:pixelated;display:block;filter:drop-shadow(0 0 6px rgba(164,107,255,.55))}
.mon.spawn canvas{transform-origin:40% 44%;animation:mspawn 1.9s cubic-bezier(.35,.1,.3,1) both}
/* přízrak se protahuje ven z díry: nejdřív jen tmavé nohy v otvoru, pak se vysouká ven a rozsvítí */
@keyframes mspawn{0%{clip-path:circle(5% at 40% 44%);scale:.45;translate:0 8%;filter:brightness(0)}
  25%{clip-path:circle(12% at 40% 44%);scale:.5;translate:0 6%;filter:brightness(.15)}
  50%{clip-path:circle(26% at 40% 44%);scale:.7;translate:0 2%;filter:brightness(.35)}
  75%{clip-path:circle(55% at 40% 44%);scale:.92;translate:0 -3%;filter:brightness(.8) drop-shadow(0 0 6px rgba(164,107,255,.55))}
  100%{clip-path:circle(90% at 40% 44%);scale:1;translate:0 0;filter:drop-shadow(0 0 6px rgba(164,107,255,.55))}}
.mon.dying canvas{animation:mdie 2.4s ease-in forwards}
@keyframes mdie{0%{filter:brightness(2) hue-rotate(40deg)}20%{rotate:180deg;translate:0 26px;filter:brightness(.9)}75%{rotate:180deg;translate:0 26px;opacity:1}100%{rotate:180deg;translate:0 30px;opacity:0;filter:blur(3px) brightness(.3)}}

.tok{position:absolute;left:0;top:0;width:40px;height:48px;transition:transform .34s cubic-bezier(.45,0,.25,1);pointer-events:auto;cursor:pointer}
.spr{position:absolute;inset:0;background-repeat:no-repeat;image-rendering:pixelated;animation:sprA var(--d) steps(var(--n)) infinite}
@keyframes sprA{from{background-position-x:0}to{background-position-x:calc(var(--n) * -40px)}}
.tok.flip .spr{transform:scaleX(-1)}
.tok.walking .spr{animation:sprA var(--d) steps(var(--n)) infinite,hop .17s ease-in-out infinite alternate}
@keyframes hop{to{translate:0 -2px}}
.tok .ring{position:absolute;left:0;bottom:-6px;width:40px;height:12px;pointer-events:none;display:none}
.tok .ring svg{width:100%;height:100%;overflow:visible;display:block}
.tok .ring path{fill:none;stroke:var(--lamp);stroke-width:2.2;stroke-linecap:round;filter:drop-shadow(0 0 2px rgba(255,207,107,.8));transition:opacity .3s}
.tok .ring path.s0{stroke:#c46a22;filter:drop-shadow(0 0 2px rgba(220,120,40,.7))}
.tok .ring path.off{opacity:.22;filter:none}.tok .ring path.hid{display:none}
.tok .ring.rb{z-index:0}.tok .spr{z-index:1}.tok .ring.rf{z-index:2}
.tok.sel .ring,.tok.pend .ring{display:block}
.tok.pend .ring{animation:ringb 1s ease-in-out infinite}
@keyframes ringb{50%{opacity:.15}}
@keyframes spin{to{transform:rotate(360deg)}}
.tok.done .spr{filter:grayscale(.5) brightness(.8)}
.tok.down .spr{filter:sepia(.5) saturate(1.6) hue-rotate(-25deg) brightness(.8)}
.tok.buried{opacity:.35}
.tok.radt .spr{filter:drop-shadow(0 0 4px var(--rad)) drop-shadow(0 0 2px var(--rad))}
.tok.pant .spr{filter:drop-shadow(0 0 4px var(--ex)) drop-shadow(0 0 2px var(--ex))}
.tok .hpbar{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:1px;background:#000c;padding:2px;pointer-events:none}
.tok .hpbar i{width:3px;height:2px;background:#4a2525;display:block}
.tok .hpbar i.f{background:var(--bad)}
.tok .hpbar i.x{background:#141217;opacity:1}
.tok .hpbar b{font-size:9px;color:#ffb4ae;font-weight:600;white-space:nowrap}
.tok .hpbar .oxy{display:flex;gap:2px;width:100%;justify-content:center;margin-top:1px}
.tok .hpbar .oxy u{display:block;width:3px;height:3px;border-radius:50%;background:#1d3a4a;text-decoration:none}
.tok .hpbar .oxy u.f{background:#5ec8ff}
.tok .exm{position:absolute;left:50%;top:-16px;width:16px;height:16px;margin-left:-8px;display:none;filter:drop-shadow(0 0 3px #000)}
.tok.exh .exm{display:block;animation:spin 2.4s linear infinite}
.tok .exm svg{width:100%;height:100%}

.mk{position:absolute;pointer-events:auto;border:1px solid;border-radius:2px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:13px;padding:0}
.mk.move{border-color:rgba(255,207,107,.22);background:rgba(255,207,107,.025);color:#ffe2a3}
.mk:not(:disabled):hover,.split button:hover{border-color:rgba(255,207,107,.85)!important;background:rgba(255,207,107,.16)!important;box-shadow:inset 0 0 22px rgba(255,207,107,.25),0 0 14px rgba(255,207,107,.2)}
.mk.na{border-color:rgba(150,145,160,.35)!important;background:rgba(120,115,130,.06)!important;color:#8a8494;cursor:not-allowed;border-style:dashed}
.mk.na span{background:#000a;color:#9a94a4}
.mk.move.fall{border-style:dashed}
.mk.move.fall span{background:#4a1416e6;color:#ffc4c0}
.mk.move.exh,.split.exh button{border-color:rgba(255,150,70,.42);background:rgba(255,150,70,.04);color:#ffd2ad}
.mk span{background:#000a;padding:0 4px;font-size:9px}
.mk.dig{border-color:rgba(217,163,107,.45);background:rgba(217,163,107,.05);color:#ffe0bd;font-size:12px}
.mk.dig.exh{border-color:rgba(255,150,70,.8);color:#ffd2ad}.mk.dig.na{border-color:#5b5664;color:#8a8494;filter:grayscale(1);opacity:.7}
.mk.rope svg{width:8px;height:10px}.mk.rope{gap:1px!important;padding:2px 0 1px!important}.mk.rope .pips{display:flex;gap:1px;background:none;padding:0}.mk.rope .pips i{width:3px;height:3px;background:rgba(255,226,163,.2)}.mk.rope .pips i.on{background:#ffe2a3}
.mk.rope{border-color:rgba(255,207,107,.5);background:#1e1810d9;color:#ffe2a3;font-size:12px;z-index:2;flex-direction:column;gap:2px;padding:4px 0 2px}

.mk.rope span{background:none}
.mk.rope.exh{border-color:rgba(255,150,70,.8);color:#ffd2ad}
.mk.rope.na{border-color:#5b5664;color:#8a8494;cursor:not-allowed;filter:grayscale(1);opacity:.7}
.mk.gemb{width:30px;height:30px;border-radius:50%;border:2px solid #ffe9a0;background:#2a2210e6;padding:4px;z-index:3;animation:idolg 1.6s infinite}
.mk.gemb svg{width:100%;height:100%}
.mk.place:hover{background:transparent!important;box-shadow:none!important;border-color:transparent!important}
.mk.place{border-color:transparent;background:transparent;align-items:flex-start;padding-top:20px;font-size:9px;color:#ffe2a3}
.mk.rotb{width:26px;height:26px;border-radius:50%;border:2px solid var(--lamp);background:#1e1810;color:var(--lamp);font-size:15px;z-index:9;box-shadow:0 4px 10px #000a}
.mk.wrapdup,.split.wrapdup{outline:2px dashed #e8d3a8;outline-offset:-1px}
.split{position:absolute;pointer-events:auto;display:flex;flex-direction:column;gap:3px}
.split button{flex:1;border:1px dashed rgba(255,207,107,.3);background:rgba(255,207,107,.025);color:#ffe2a3;font-family:var(--display);font-size:8.5px;cursor:pointer;padding:0;line-height:1.1;letter-spacing:.02em}
.split button.ex{border-style:solid}
.split button:hover{background:rgba(255,207,107,.12);border-color:rgba(255,207,107,.8)}
.split small{display:block;font-family:var(--body);font-size:6.5px;opacity:.7}
.split{gap:2px}

.fxt.sm{font-size:13px;font-weight:600}
.fxt{position:absolute;font-family:var(--display);font-weight:700;color:var(--bad);font-size:22px;text-shadow:0 2px 0 #000;animation:rise 1.2s ease-out forwards;white-space:nowrap;pointer-events:none}
.fxt.g{color:var(--good)}

body.tut #evcards{display:none}body.tut.f-ev #evcards{display:flex}
body.tut #info{visibility:hidden}body.tut.f-info #info{visibility:visible}
body.tut #topr .ib:not(#bNew):not(#bSnd){display:none}
.split .spl0{flex:1}
/* obrazovkové efekty */
#scr{position:absolute;left:0;right:0;top:0;bottom:var(--barh);pointer-events:none;z-index:26;overflow:hidden}
#scr .vig{position:absolute;inset:0;box-shadow:inset 0 0 180px 60px rgba(0,0,0,.85)}
#scr .sf{position:absolute;inset:0;opacity:0;transition:opacity .4s}
#scr .sf.red{box-shadow:inset 0 0 160px 40px rgba(200,20,30,.55)}
#scr .sf.grn{box-shadow:inset 0 0 160px 50px rgba(120,255,80,.45)}
#scr .sf.org{box-shadow:inset 0 0 150px 40px rgba(255,120,30,.45)}
#scr .sf.blu{box-shadow:inset 0 -120px 160px 0 rgba(60,140,190,.5)}
#scr .sf.pur{box-shadow:inset 0 0 160px 50px rgba(150,80,255,.4)}
#scr .sf.cyan{box-shadow:inset 0 0 200px 60px rgba(120,255,233,.45)}
#scr.tension .sf.red{opacity:.45;animation:tens 3.2s ease-in-out infinite}
#scr.faint .sf.red{opacity:1;animation:faint .85s ease-in-out infinite}
@keyframes tens{50%{opacity:.18}}
@keyframes faint{0%,100%{opacity:.55}15%{opacity:1}30%{opacity:.7}45%{opacity:.95}}
#scr.faint .vig{box-shadow:inset 0 0 220px 90px rgba(0,0,0,.92)}
#scr .sf.flash{opacity:1;transition:none}
.dust{position:absolute;top:-30px;background:#4b3a2c;animation:dustf var(--t) cubic-bezier(.4,0,.9,.6) forwards;opacity:.9}
@keyframes dustf{to{transform:translate(var(--dx),calc(100vh + 60px)) rotate(var(--r));opacity:.6}}
.haze{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,rgba(120,100,80,.35),transparent 70%);animation:haze 2.2s ease-out forwards}
@keyframes haze{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

/* laboratorní karty událostí */
#evcards{position:absolute;top:0;left:max(16px,calc(50% - 610px));display:flex;gap:8px;z-index:28;pointer-events:none}
.lcard{position:relative;width:150px;height:178px;padding:8px 9px 7px;display:flex;flex-direction:column;pointer-events:auto;
  background:linear-gradient(180deg,#e4dcc6,#cfc5ab);color:var(--paperink);box-shadow:0 10px 18px #000b,inset 0 0 0 1px #a99d7f;
  transform:translateY(-71%) rotate(var(--rot,0deg));transition:transform .55s cubic-bezier(.3,.8,.3,1.15),filter .5s,opacity .5s}
.lcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 13px,rgba(70,90,140,.13) 13px 14px);pointer-events:none}
.lcard:hover{transform:translateY(-4%) rotate(0deg);z-index:2}
.lcard.used{transform:translateY(-88%) rotate(var(--rot,0deg));filter:grayscale(1) brightness(.5);opacity:.75}
.lcard.used:hover{transform:translateY(-4%);filter:grayscale(.6) brightness(.8)}
.lc-code{font-size:9px;letter-spacing:.12em;color:#7a6f58;border-bottom:1px solid #a99d7f;padding-bottom:2px}
.lc-txt{font-size:11px;line-height:1.3;margin:6px 0 0;flex:1}
.evl{margin:0;padding:0;list-style:none}.evl li{position:relative;padding-left:10px;margin:0 0 5px;text-wrap:pretty}.evl li::before{content:'–';position:absolute;left:0;color:#7a6f58}
.bigcard .evl{margin-top:8px;font-size:14px;line-height:1.4}.bigcard .evl li{margin-bottom:7px;padding-left:13px}
.rtab .evl li{margin-bottom:3px}
.lc-bot{display:flex;align-items:center;gap:6px;margin-top:auto;border-top:1px dashed #9a8e70;padding-top:4px}
.lc-bot b{font-family:var(--display);font-size:15px}
.lc-ic svg{width:22px;height:22px;display:block;filter:saturate(.3) brightness(.62) contrast(1.2)}
.lc-stamp{position:absolute;right:6px;top:38%;transform:rotate(-14deg);border:2px solid #9a2a20;color:#9a2a20;font-family:var(--display);font-size:11px;padding:0 4px;opacity:.85}

#topr{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:30;flex-wrap:wrap;justify-content:flex-end;max-width:46vw}
.ib{height:32px;min-width:32px;padding:0 9px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:var(--display);font-size:14px;cursor:pointer}
.ib:hover:not(:disabled){border-color:var(--lampdim);color:var(--lamp)}
.ib:disabled{opacity:.35;cursor:not-allowed}
#camctl{position:absolute;right:12px;bottom:calc(var(--barh) + 12px);display:flex;flex-direction:column;gap:4px;z-index:30}

/* spodní lišta */
#bar{position:absolute;left:0;right:0;bottom:0;height:var(--barh);display:grid;grid-template-columns:196px minmax(0,1fr) 330px;gap:12px;align-items:stretch;
  padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(to top,#050407 75%,#050407e6);border-top:1px solid #1c1922;z-index:30}
#info{display:flex;flex-direction:column;justify-content:center;gap:4px}
.irow{display:flex;align-items:baseline;gap:8px}
.irow .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:60px}
.irow b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.irow b.big{font-size:32px;line-height:1}
.irow.warn b{color:var(--bad);text-shadow:0 0 10px rgba(255,60,60,.6)}
.irow.zero b{color:var(--bad);animation:faint .85s ease-in-out infinite}
.irow.dk0 b{color:var(--bad)}
.irow.near b{color:var(--good);text-shadow:0 0 10px rgba(109,255,176,.6)}
.irow .cut{font-family:var(--display);color:var(--bad);font-size:14px;animation:rise 1.4s ease-out forwards;position:absolute}
#crewList{display:flex;gap:8px;justify-content:center;align-items:stretch;min-width:0}
.crew{display:flex;gap:8px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);padding:6px 8px;cursor:pointer;width:228px;min-width:0;position:relative;transition:border-color .2s,box-shadow .2s,filter .3s}
.crew:disabled{cursor:default}
.crew.on{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp),0 0 20px -4px var(--lamp)}
.crew.pend{border-color:var(--lamp);border-style:dashed;animation:blink 1s infinite}
.crew.done{filter:grayscale(.55) brightness(.8)}
.crew.gone{opacity:.3;filter:grayscale(1)}
.pimg{width:44px;height:44px;image-rendering:pixelated;display:block;flex:none;background:#0d0b11;border:1px solid var(--line)}
.crew .pimg.down{filter:sepia(.6) hue-rotate(-25deg) saturate(1.6) brightness(.75)}
.cinfo{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.cname{font-family:var(--display);font-size:16px;display:flex;align-items:center;gap:6px;line-height:1}
.inv{display:inline-flex;gap:2px}.invi svg{width:14px;height:14px;display:block}
.hp{display:flex;gap:2px;align-items:center}
.hp i{width:8px;height:8px;background:var(--bad);display:block}
.hp i.empty{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad)}
.hp i.lost{background:linear-gradient(45deg,transparent 44%,#4a1c1c 44% 56%,transparent 56%),#0b0a0e;box-shadow:inset 0 0 0 1px #1c1a22}
.hp i.gone{background:#000;box-shadow:inset 0 0 0 1px #444}
.hp .oxy{display:flex;gap:3px;margin-left:4px}.hp .oxy u{display:block;width:6px;height:6px;border-radius:50%;background:#1d3a4a;text-decoration:none}.hp .oxy u.f{background:#5ec8ff}
.ap{display:flex;gap:4px;align-items:center}
.ap i{width:9px;height:9px;border:1.5px solid var(--lamp);display:block;transform:rotate(45deg)}
.ap i.used{background:var(--lamp)}
.ap i.ex{border-color:#b8621f}.ap i.ex.used{background:#b8621f}
.cst{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.cst span{font-size:9.5px;padding:0 4px;background:#2a2532;color:#d8d2e0;letter-spacing:.04em}
.cst .bad{background:#4a1a1a;color:#ffc0b8}.cst .w{background:#173246}.cst .r{background:#1f3a12;color:#cfffaf}.cst .ab{background:#2a1d48;color:#ddd0ff}.cst .on{background:#4a3a14;color:#ffe2a3}
#actions{display:flex;flex-direction:column;gap:5px;min-width:0;overflow:auto}
.ahead{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:15px}
.ahead small{font-family:var(--body);font-size:10.5px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:4px}
.act{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);padding:4px 7px;cursor:pointer;font-size:11.5px;white-space:nowrap}
.act small{color:var(--muted);font-family:var(--display);font-size:12px}
.act:hover:not(:disabled){border-color:var(--lampdim)}
.act.on{border-color:var(--lamp);background:#2a2110}
.act:disabled{opacity:.35;cursor:not-allowed}
.act.end{border-color:var(--lampdim);background:#1e1810}
.act.gold{border-color:#c9a24a}.act.grn{border-color:var(--good)}.act.pur{border-color:#8f6bff}
.hpic{width:18px;height:18px;image-rendering:pixelated;display:inline-block}
.warnline{color:var(--ex);font-size:11px}
.hintl{color:var(--muted);font-size:10.5px}

/* dialog sekvence */
#seq{position:absolute;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);cursor:pointer}
.bigcard{width:340px;padding:14px 16px;background:linear-gradient(180deg,#e4dcc6,#cfc5ab);color:var(--paperink);box-shadow:0 30px 60px #000,inset 0 0 0 1px #a99d7f;position:relative;animation:cardin .35s cubic-bezier(.3,.8,.3,1.2);transform:rotate(-1.5deg)}
.bigcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 15px,rgba(70,90,140,.12) 15px 16px);pointer-events:none}
@keyframes cardin{from{transform:translateY(-60px) rotate(4deg);opacity:0}}
.bigcard .lc-code{font-size:10px}
.bigcard .bc-ic svg{width:46px;height:46px;display:block;margin:8px 0}
.bigcard .bc-name{font-family:var(--display);font-size:32px;line-height:1}
.bigcard p{margin:6px 0 0;font-size:14px;line-height:1.4;text-wrap:pretty}
.bigcard .crit{position:absolute;right:10px;top:30px;transform:rotate(-12deg);border:2px solid #b32a20;color:#b32a20;font-family:var(--display);font-size:14px;padding:1px 6px}
.scard{background:var(--panel);border:1px solid var(--line);padding:14px 18px;min-width:280px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 60px #000;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.scard.rad{border-color:var(--rad);box-shadow:0 0 40px -10px var(--rad),0 20px 60px #000}
.scard .pimg{width:56px;height:56px}
.slab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sname{font-family:var(--display);font-size:24px;line-height:1.1}
.sres{margin-left:auto;font-family:var(--display);font-size:36px;min-width:64px;text-align:center}
.sres.roll{color:var(--muted);animation:blink .18s steps(2) infinite}
.sres.hit{color:var(--bad)}.sres.miss{color:var(--good)}
.dieroll{display:flex;flex-direction:column;align-items:center;gap:10px}
.die3{width:76px;height:76px;display:flex;align-items:center;justify-content:center;font-family:'Times New Roman',serif;font-weight:700;font-size:40px;color:var(--gold);
  background:radial-gradient(circle at 35% 30%,#8a8178,#4a443e);box-shadow:inset -6px -6px 0 #2e2a26,inset 4px 4px 0 #a39a90,0 12px 24px #000;text-shadow:0 0 10px rgba(232,194,90,.7);letter-spacing:-2px}
.die3.rolling{animation:droll .14s linear infinite}
@keyframes droll{25%{transform:rotate(12deg) translateY(-6px)}75%{transform:rotate(-12deg) translateY(-3px)}}
.die3.land{animation:dland .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes dland{from{transform:scale(1.3)}}
.skip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}

#offs{position:absolute;inset:0;pointer-events:none;z-index:24}
.offa{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;pointer-events:auto;cursor:pointer;border:2px solid;background:#0d0b11;padding:0}
.offa img{width:100%;height:100%;image-rendering:pixelated;display:block}
.offa i{position:absolute;width:0;height:0;border:7px solid transparent}

#modal{position:fixed;inset:0;background:#000c;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#0f0d13;border:1px solid var(--line);max-width:780px;width:100%;max-height:88vh;overflow:auto;padding:18px;box-shadow:0 30px 80px #000}
.mbox h2{font-size:26px;color:var(--lamp);margin-bottom:8px}
.mbox h3{font-size:16px;color:var(--muted);margin:14px 0 8px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.btn{background:var(--panel2);border:1px solid var(--line);padding:7px 12px;cursor:pointer;font-family:var(--display);font-size:14px}
.btn:hover:not(:disabled){border-color:var(--lampdim)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--lamp);color:#1d140a;border-color:var(--lamp)}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.dt{background:var(--panel2);border:1px solid var(--line);padding:6px;text-align:center;font-size:11px}
.dt .mini{width:76px;height:76px;margin:0 auto 4px}
.dt b{font-family:var(--display);font-size:15px;color:var(--lamp)}
.rules{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px;max-width:72ch;font-size:12.5px}
.big{font-size:44px;font-family:var(--display);color:var(--lamp)}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px;overflow:auto}
.loglist li{padding:2px 0;border-bottom:1px solid #1e1b24;color:#cfc8d6}
.loglist li.bad{color:#ffb4ae}.loglist li.good{color:var(--good)}.loglist li.evt{color:var(--lamp);font-weight:600;padding-top:6px}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.offer{background:#1d1530;border:2px solid #5a4fa0;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:4px;position:relative}
.offer.sel{border-color:var(--lamp);box-shadow:0 0 14px -4px var(--lamp)}
.offer b,.slot b{font-family:var(--display);font-size:15px}
.offer small,.slot small{color:var(--muted);font-size:11.5px;line-height:1.3}
.offer .price{position:absolute;right:10px;top:8px;color:var(--gold);font-family:var(--display)}
.schars{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}
.scharc{background:var(--panel2);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.scharc.gone{opacity:.4}
.schead{display:flex;gap:8px;align-items:center}
.slot{border:2px dashed var(--line);padding:8px;min-height:58px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.slot.full{border-style:solid;border-color:#5a4fa0;background:#1a1530}
.slot.over{border-color:var(--lamp);background:#2a2110}
.slot .up{align-self:flex-start;padding:3px 8px;font-size:12px}
.gemsbig{font-family:var(--display);font-size:26px;color:var(--gold)}
.cur{display:inline-block;width:14px;height:14px;vertical-align:-2px}
.cur svg{width:100%;height:100%}

@media (max-width:900px){
  :root{--barh:236px}
  #bar{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto;grid-template-areas:"info actions" "crew crew"}
  #info{grid-area:info}#actions{grid-area:actions}#crewList{grid-area:crew;overflow-x:auto;justify-content:flex-start}
  .crew{width:200px;flex:none}
  .lcard{width:46px;height:120px;padding:4px}.lc-txt,.lc-code,.lc-bot b,.lc-stamp{display:none}.lc-bot{border:0;justify-content:center}
  #evcards{gap:3px;left:4px}
  #topr{gap:3px;top:6px;right:6px;max-width:58vw}.ib{height:28px;min-width:28px;padding:0 6px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

/* ===== plán laboratoře (mapa runu) ===== */
#rmap{position:fixed;inset:0;z-index:50;overflow:auto;background:#191612;
  background-image:radial-gradient(ellipse at 50% 30%,rgba(90,70,45,.35),transparent 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 9px);
  padding:40px 350px 120px 24px}
#rmap[hidden]{display:none}
#rmap .bpwrap{width:max-content;margin:0 auto 0 0;box-shadow:0 30px 60px rgba(0,0,0,.55)}
#rmap .bp{position:relative;color:#3a3128;
  background-color:#d6ccb4;
  background-image:
    linear-gradient(90deg,transparent 49.6%,rgba(60,45,25,.10) 49.85%,rgba(255,250,235,.28) 50.15%,transparent 50.5%),
    linear-gradient(0deg,transparent 33.1%,rgba(60,45,25,.09) 33.3%,rgba(255,250,235,.25) 33.5%,transparent 33.8%),
    linear-gradient(0deg,transparent 66.4%,rgba(60,45,25,.09) 66.6%,rgba(255,250,235,.25) 66.8%,transparent 67.1%),
    radial-gradient(ellipse at 20% 10%,rgba(120,90,40,.16),transparent 35%),radial-gradient(ellipse at 85% 75%,rgba(110,80,40,.18),transparent 30%),
    radial-gradient(ellipse at 60% 45%,rgba(255,250,235,.25),transparent 60%),
    linear-gradient(rgba(70,60,45,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(70,60,45,.13) 1px,transparent 1px),
    linear-gradient(rgba(70,60,45,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(70,60,45,.06) 1px,transparent 1px);
  background-size:auto,auto,auto,auto,auto,auto,100px 100px,100px 100px,20px 20px,20px 20px;
  box-shadow:inset 0 0 120px rgba(90,60,25,.45),inset 0 0 18px rgba(60,40,15,.5)}
#rmap .bp::after{content:"";position:absolute;inset:22px;border:2px solid rgba(58,49,40,.55);outline:1px solid rgba(58,49,40,.35);outline-offset:-7px;pointer-events:none}
.bphead{position:absolute;left:50px;top:42px;display:flex;flex-direction:column;gap:2px}
.bpt{font-family:var(--display);font-size:34px;letter-spacing:.12em;color:#3a3128}
.bps{font-family:Caveat,cursive;font-size:20px;color:#5a4c3c}
.bpcrew{position:absolute;right:56px;top:46px;text-align:right;font-family:Caveat,cursive;font-size:22px;line-height:1.1;color:#3a3128}
.bpcrew s{opacity:.5}.bpcrew .cur svg{filter:sepia(1) saturate(.4) brightness(.5)}
.mcompass{position:absolute;right:70px;top:130px;width:80px;height:80px;opacity:.75}
.mtitleblock{position:absolute;right:46px;bottom:46px;border:1.5px solid #3a3128;display:grid;grid-template-columns:1fr;font-family:Caveat,cursive;font-size:17px;color:#3a3128;background:rgba(230,222,200,.3)}
.mtitleblock>*{padding:2px 10px;border-bottom:1px solid rgba(58,49,40,.5)}.mtitleblock b{font-family:var(--display);font-size:14px;letter-spacing:.1em}
.mstain{position:absolute;width:150px;height:150px;border-radius:50%;border:7px solid rgba(110,70,30,.13);box-shadow:inset 0 0 18px rgba(110,70,30,.12);pointer-events:none}
.mstain.s2{width:110px;height:110px;border-width:5px;opacity:.8}
.mnote{position:absolute;font-family:Caveat,cursive;font-size:22px;color:rgba(70,50,30,.75);pointer-events:none;white-space:nowrap}
.mnote.nv1,.mnote.nv2,.mnote.nv3{white-space:normal;width:170px;padding:12px 12px 10px;font-size:20px;line-height:1.05;color:rgba(50,38,24,.9);box-shadow:2px 4px 8px rgba(0,0,0,.3)}
.mnote.nv1{background:linear-gradient(160deg,#e6d27a,#cdb85e);clip-path:polygon(0 0,100% 0,100% 88%,90% 100%,0 100%)}
.mnote.nv1::before,.mnote.nv3::before{content:'';position:absolute;left:50%;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#a3241a 70%);box-shadow:1px 2px 2px rgba(0,0,0,.4)}
.mnote.nv2{background:#ece5d0;width:160px;clip-path:polygon(0 3%,8% 0,22% 4%,38% 0,55% 3%,71% 0,86% 3%,100% 0,100% 100%,0 100%)}

    for(let y=y0;eConn(x,y)&&!vsq(x,y+1);y++)set.add(x+','+(y+1));     // žebřík do koridoru nevede
    for(let y=y0;y>0&&eConn(x,y-1)&&!vsq(x,y-1);y--)set.add(x+','+(y-1));

function applyMod(){

function moveOpts(s,downed){
  const res=[],cell=B(s.x,s.y);if(!cell||s.buried)return res;
  const r=s.rope!=null?ropeById(s.rope):null;
  const onSeg=r&&s.y>=r.yTop&&s.y<r.yBottom;

    const d=dx>0?E:Wd;
    const nx=wx(s.x+dx),n=B(nx,s.y);
    if(!n||n.rubble||!edgeOpen(s.x,s.y,d))continue;
    if(n.t.feat==='squeeze'&&G.chars.some(o=>onBoard(o)&&o.id!==s.id&&o.x===nx&&o.y===s.y))continue;   // v průlezu jen jeden
    const rr=G.ropes.find(q=>q.x===nx&&s.y>=q.yTop&&s.y<q.yBottom);
    const m={x:nx,y:s.y,rope:rr?rr.id:null,cost:costOf(nx,s.y)};
    if(!fitShaft(m,s,downed))continue;

  const ropes=onSeg?[r]:G.ropes.filter(q=>q.x===s.x&&(q.yBottom===s.y||((s.ledge||vsq(s.x,s.y))&&s.y>=q.yTop&&s.y<q.yBottom)));   // i z úzkého koridoru se dá chytit lana
  for(const q of ropes)for(const ny of [s.y-1,s.y+1]){
    if(ny<q.yTop||ny>q.yBottom)continue;const c=B(s.x,ny);if(!c||c.rubble||!vConn(s.x,Math.min(s.y,ny)))continue;

function dmg(c,n,why){

function spawnGhost(x,y){

function ghostNbrs(x,y){
  const c=B(x,y),res=[];if(!c)return res;
  for(let d=0;d<4;d++){const [nx,ny]=NB(x,y,d),n=B(nx,ny);if(n&&!n.rubble&&edgeOpen(x,y,d)&&n.t.feat!=='bunker')res.push([nx,ny]);}   // závalem, zavřenými dveřmi ani do krytu neprojdou
  return shuffle(res);

function ghostStep(m){
  if(m.qdead)return;
  const targets=G.chars.filter(c=>standing(c)&&!isBunker(c.x,c.y));
  const quars=[];G.board.forEach((q,i)=>{if(q&&q.t.feat==='quar'&&!q.rubble)quars.push({x:i%COLS,y:(i/COLS)|0,quar:true});});   // karanténa přízraky láká
  if(!targets.length&&!quars.length)return;
  const here=targets.filter(c=>c.x===m.x&&c.y===m.y);
  if(here.length){here.forEach(c=>dmg(c,2,'přízrak'));return;}
  const key=(x,y)=>x+','+y, dist=new Map([[key(m.x,m.y),0]]), first=new Map();
  const q=[[m.x,m.y]];
  while(q.length){const [x,y]=q.shift(),d=dist.get(key(x,y));
    for(const [nx,ny] of ghostNbrs(x,y)){const k=key(nx,ny);if(dist.has(k))continue;dist.set(k,d+1);first.set(k,d===0?[nx,ny]:first.get(key(x,y)));q.push([nx,ny]);}}
  let best=1e9,cand=[];
  targets.concat(quars).forEach(c=>{const d=dist.get(key(c.x,c.y));if(d==null||d===0)return;if(d<best){best=d;cand=[c];}else if(d===best)cand.push(c);});
  if(!cand.length)return;
  if(cand.some(q=>q.quar))cand=cand.filter(q=>q.quar);   // při remíze vyhrává karanténa
  const t=pick(cand),[nx,ny]=first.get(key(t.x,t.y));
  if(G.monsters.some(o=>o!==m&&o.x===nx&&o.y===ny))return;   // dva přízraky nikdy na jednom poli: čeká ve frontě
  if(UI.ready&&G.evPhase){if(m.sx==null){m.sx=m.x;m.sy=m.y;}if(t.quar)SEQ.push({k:'qlure',x:t.x,y:t.y});SEQ.push({k:'mmove',mid:m.id,x:nx,y:ny});}
  m.x=nx;m.y=ny;
  if(quarKill(m))return;
  pipeTick();
  G.chars.filter(c=>standing(c)&&c.x===m.x&&c.y===m.y).forEach(c=>dmg(c,2,'přízrak'));
}

function pipeTick(){G.board.forEach((c,i)=>{if(!c||c.t.feat!=='pipe'||c.rubble)return;const x=i%COLS,y=(i/COLS)|0,now=[];
  G.chars.forEach(o=>{if(onBoard(o)&&o.x===x&&o.y===y)now.push('c'+o.id);});G.monsters.forEach(m=>{if(!m.qdead&&m.x===x&&m.y===y)now.push('m'+m.id);});
  const old=c.pipeIn||[],nw=now.filter(k=>!old.includes(k));c.pipeIn=now;
  nw.forEach(k=>{if(G.W<=0)return;const who=k[0]==='c'?G.chars[+k.slice(1)].name:'Přízrak';log(`${who} rozkýval(a) prasklé potrubí. Voda stoupá o patro!`,'bad');if(UI.ready)SEQ.push({k:'pipe',x,y});waterChange(-1,true);});});}

function springEnd(c){if(c.dead||!onSpring(c)||!(c.downed||c.hp<c.maxHp))return;const was=c.downed,g=was?Math.min(3,c.maxHp):Math.min(3,c.maxHp-c.hp);c.downed=false;c.hp=was?g:c.hp+g;fx(c,'+'+g,true);

// teleport
function teleMate(c){const here=B(c.x,c.y);if(!here||here.t.feat!=='tele')return null;
  let o=null,oc=null;G.board.forEach((q,i)=>{if(q&&q.t.feat==='tele'&&q!==here&&!o){o={x:i%COLS,y:(i/COLS)|0};oc=q;}});
  if(o)return oc.rubble?null:o;return G.deck.some(t=>t.feat==='tele')?{fresh:true}:null;}
function actTele(c){
  const m=teleMate(c);if(!m||remaining(c)<1)return;
  const free=[];for(let yy=0;yy<ROWS;yy++)for(let xx=0;xx<COLS;xx++)if(!B(xx,yy))free.push([xx,yy]);
  if(m.fresh&&!free.length){log('Teleport nemá kam vést.');return;}
  pushUndo();spend(c,1);const from={x:c.x,y:c.y};let x=m.x,y=m.y;
  if(m.fresh){
    const t=G.deck.splice(G.deck.findIndex(q=>q.feat==='tele'),1)[0];
    [x,y]=pick(free);const o=pick(orients(t,null));
    log(`${c.name} vstoupil(a) do teleportu a objevil(a) se i s druhým teleportem kdesi v hlubině!`,'ev');
    c.x=x;c.y=y;c.rope=null;c.ledge=false;placeCell(x,y,t,o,null,0);G.info=true;
  }else{log(`${c.name} prošel(a) teleportem.`,'ev');c.x=x;c.y=y;c.rope=null;c.ledge=false;}
  if(isHole(x,y)&&!flooded(y)){const others=G.chars.filter(o=>o!==c&&onBoard(o)&&o.x===x&&o.y===y);
    const rp=G.ropes.find(r=>r.x===x&&y>=r.yTop&&y<r.yBottom);
    if(ledgeOK(x,y)&&!others.some(o=>o.ledge))c.ledge=true;                       // na prknech je místo
    else if(rp&&!others.some(o=>o.rope===rp.id))c.rope=rp.id;                     // chytí se lana
  }   // jinak spadne
  c.tp={from,to:{x,y}};c.arr=G.nid++;
  afterAction(c);settle();
}

function trapTick(){G.board.forEach((c,i)=>{if(!c||c.t.feat!=='trap')return;const x=i%COLS,y=(i/COLS)|0;c.trapIn=(c.trapIn||[]).filter(id=>{const o=G.chars[id];return onBoard(o)&&o.x===x&&o.y===y;});

  const nw=G.chars.filter(o=>onBoard(o)&&o.x===x&&o.y===y&&!c.trapIn.includes(o.id)),nm=G.monsters.filter(m=>!m.qdead&&m.x===x&&m.y===y&&!c.monIn.includes(m.id));if(!nw.length&&!nm.length)return;
  nw.forEach(o=>c.trapIn.push(o.id));nm.forEach(m=>c.monIn.push(m.id));const was=!!c.shut&&c.e.every((v,d)=>!v||c.shut[d]);c.shut=c.e.map(v=>!!v);if(was)return;c.slam=true;
  log(`Dveře pasti se zabouchly! ${nw.map(o=>o.name).concat(nm.map(()=>'přízrak')).join(', ')} uvnitř.`,nw.length?'bad':'good');if(UI.ready){c.slamPending=true;SEQ.push({k:'slam',x,y});}});}
function doorTargets(c){if(c.downed)return [];const res=[];for(let d=0;d<4;d++){const cell=B(c.x,c.y);if(!cell||!cell.e[d]||shutAt(cell,d))continue;const [nx,ny]=NB(c.x,c.y,d),n=B(nx,ny);

// střílna: kdo vstoupí na pole kulometu nebo do laseru, 50 % na zásah; přízrak v cestě střelu schytá místo něj
function laserCells(x,y){const out=[];for(let d=0;d<4;d++){let cx=x,cy=y;for(let k=0;k<COLS+ROWS;k++){if(!edgeOpen(cx,cy,d))break;[cx,cy]=NB(cx,cy,d);const n=B(cx,cy);if(!n||n.rubble)break;out.push({x:cx,y:cy,d,k:k+1});}}return out;}
function turretCheck(c){G.board.forEach((t,i)=>{if(!t||t.t.feat!=='turret'||t.rubble)return;const tx=i%COLS,ty=(i/COLS)|0;
  if(tx===c.x&&ty===c.y)return;   /* přímo na poli střílny je mrtvý úhel */
  const lc=laserCells(tx,ty).find(q=>q.x===c.x&&q.y===c.y);if(!lc)return;
  G.info=true;const fire=!rollP(.5,c.name,'střílna (vyhnout se výstřelu)');

  let shield=null;if(lc){let cx=tx,cy=ty;for(let k=1;k<lc.k;k++){[cx,cy]=NB(cx,cy,lc.d);const m=G.monsters.find(q=>q.x===cx&&q.y===cy&&!q.qdead);if(m){shield=m;break;}}}
  t.aim=lc?lc.d:t.aim;if(UI.ready)SEQ.push({k:'turret',tx,ty,ti:i,x:shield?shield.x:c.x,y:shield?shield.y:c.y,hit:true});

// jádro radiace: při události Radiace ozáří okolí do 2 kroků po chodbách; zasažený začne kolo o akci (při kritickém o dvě) méně
function coreZone(x,y){const key=(a,b)=>a+','+b,D=new Map([[key(x,y),0]]),q=[[x,y]],out=[[x,y,0]];
  while(q.length){const [cx,cy]=q.shift(),d=D.get(key(cx,cy));if(d>=2)continue;for(let dd=0;dd<4;dd++){if(!edgeOpen(cx,cy,dd))continue;const [nx,ny]=NB(cx,cy,dd),n=B(nx,ny);if(!n||n.rubble||D.has(key(nx,ny)))continue;D.set(key(nx,ny),d+1);q.push([nx,ny]);out.push([nx,ny,d+1]);}}return out;}
function coreBurst(crit){const cells=new Map();G.board.forEach((t,i)=>{if(t&&t.t.feat==='core'&&!t.rubble)coreZone(i%COLS,(i/COLS)|0).forEach(([x,y,d])=>{const k=x+','+y;if(!cells.has(k)||cells.get(k)>d)cells.set(k,d);});});
  if(!cells.size)return;const sq=UI.ready?{k:'core',cells:[...cells].map(([k,d])=>{const [x,y]=k.split(',').map(Number);return {i:idx(x,y),d};}),hits:[]}:null;if(sq)SEQ.push(sq);
  G.chars.filter(o=>onBoard(o)&&cells.has(o.x+','+o.y)&&!isBunker(o.x,o.y)).forEach(o=>{{const ar=alv(o,'antirad');if(ar&&rollP(ar*.15,o.name,'Antiradiace proti jádru')){log(`${o.name} (Antiradiace) jádru odolal(a).`,'good');return;}}
    if(sq)sq.hits.push({cid:o.id,x:o.x,y:o.y,d:cells.get(o.x+','+o.y)});o.sap=Math.min(2,(o.sap||0)+1);log(`${o.name}: jádro radiace, příští kolo o ${o.sap} ${o.sap===1?'akci':'akce'} méně.`,'bad');});}

// lana: vždy visí co nejníž (po vykopání závalu, výbuchu, otevření dveří) a lana ve stejné šachtě, která se dotýkají, se spojí
function ropeTick(){
  G.ropes.forEach(r=>{const nb=ropeDown(r.x,r.yBottom);if(nb>r.yBottom){r.yBottom=nb;log('Lano se protáhlo níž.','good');}});
  for(let i=0;i<G.ropes.length;i++)for(let j=G.ropes.length-1;j>i;j--){const a=G.ropes[i],b=G.ropes[j];if(a.x!==b.x||a.yBottom<b.yTop||b.yBottom<a.yTop)continue;
    a.yTop=Math.min(a.yTop,b.yTop);a.yBottom=Math.max(a.yBottom,b.yBottom);G.chars.forEach(c=>{if(c.rope===b.id)c.rope=a.id;});G.ropes.splice(j,1);}
}

// jde sem vůbec něco odhalit? (tutoriál: jen podle mapy; jinak zařízení v zóně nebo pasující dílek v balíčku)
function canRevealAt(x,y,need){
  if(G.tut)return typeof tutTile==='function'&&!!tutTile(x,y,need);
  return (inZone(x,y)&&!G.leverFound)||G.deck.some(t=>orients(t,need).length);

function actReveal(c,d,explore){

  if(G.tut&&!TT){log('Tudy tutoriál nevede.');render();return;}
  if(!G.tut&&!(inZone(x,y)&&!G.leverFound)&&!G.deck.some(t=>orients(t,need).length)){log('V balíčku už není destička, která by sem pasovala.');render();return;}
  pushUndo();spend(c,1);G.info=true;undoStack=[];
  const ex=TT?false:isLeverCell(x,y,need);

function ropeOptions(c){const r=ropeOptions0(c),b=Math.min(2,alv(c,'climber'))*.15;r.forEach(o=>o.chance=Math.min(.95,o.chance+b));return r;}
function ropeOptions0(c){
  const res=[],cell=B(c.x,c.y);if(!cell)return res;
  const overlap=(x,a,b)=>G.ropes.find(r=>r.x===x&&r.yTop<=b&&a<=r.yBottom);
  for(const d of [E,Wd]){
    const [nx]=NB(c.x,c.y,d),n=B(nx,c.y);
    if(!n||n.rubble||!cell.e[d]||!n.e[OPP[d]]||!isHole(nx,c.y))continue;
    const yb=ropeDown(nx,c.y),ov=overlap(nx,c.y,yb);
    if(!ov||ov.yTop>c.y)res.push({x:nx,yTop:c.y,yBottom:Math.max(yb,ov?ov.yBottom:yb),chance:.8,down:true,extend:ov?ov.id:null});   // lano níž v šachtě se jen protáhne nahoru
  }
  // dolů jen z okraje, nahoru odkudkoli, kde vede otevřená cesta nahoru
  const inSq=vsq(c.x,c.y)&&vConn(c.x,c.y);
  if((c.ledge&&isHole(c.x,c.y))||inSq){
    const yb=ropeDown(c.x,c.y),ov=overlap(c.x,c.y,yb);
    if(!ov||ov.yTop>c.y)res.push({x:c.x,yTop:c.y,yBottom:Math.max(yb,ov?ov.yBottom:yb),chance:.8,down:true,self:true,extend:ov?ov.id:null});
  }
  // zespodu nebo z lana: hodit lano nahoru otevřenou šachtou (ne tam, kde je žebřík)
  let y=c.y,k=0;
  while(k<3&&y>0&&vConn(c.x,y-1)&&!stairLink(c.x,y-1)){
    y--;k++;
    const yb=ropeDown(c.x,c.y);
    const ov=overlap(c.x,y,yb);
    if(ov&&ov.yTop<=y)continue;
    res.push({x:c.x,yTop:y,yBottom:Math.max(yb,ov?ov.yBottom:yb),chance:[.6,.4,.2][k-1],extend:ov?ov.id:null,self:(!!c.ledge&&isHole(c.x,c.y))||vsq(c.x,c.y)});
  }
  return res;
}

function sprintTargets(c){
  const res=[],seen=new Set([c.x+','+c.y]);let front=[{s:{x:c.x,y:c.y,rope:c.rope},path:[]}];
  for(let depth=0;depth<3;depth++){
    const next=[];
    for(const node of front){
      for(const m of moveOpts(node.s,false)){
        if(m.cost>1)continue;const k=m.x+','+m.y;
        if(seen.has(k)){const i=res.findIndex(q=>{const l=q[q.length-1];return l.x===m.x&&l.y===m.y;});
          if(i>=0&&wouldFall(res[i][res[i].length-1])&&!wouldFall(m)){const p=node.path.concat([m]);res[i]=p;next.push({s:m,path:p});}continue;}
        seen.add(k);const p=node.path.concat([m]);res.push(p);
        if(!wouldFall(m))next.push({s:m,path:p});
      }
    }
    front=next;
  }
  return res;
}

const TPX={cx0:5,cx1:43,cy0:7,fb:33,ft:37,fe:41,sx0:15,sx1:33};
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function px(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function rng(seed){let s=((seed+1)*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function hash(s){let h=7;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))%99991;return h;}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;const m=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return '#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('');}
function pline(g,x0,y0,x1,y1,c,w){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);w=w||1;g.fillStyle=c;
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx+dy;
  for(let i=0;i<300;i++){g.fillRect(x0,y0,w,w);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx;}if(e2<=dx){err+=dx;y0+=sy;}}}
function pcirc(g,cx,cy,r,c){g.fillStyle=c;for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.6)g.fillRect(Math.round(cx+x),Math.round(cy+y),1,1);}
function outline(src,col){
  const w=src.width,h=src.height,o=mkCanvas(w,h),g=o.getContext('2d'),m=mkCanvas(w,h),mg=m.getContext('2d');
  mg.drawImage(src,0,0);mg.globalCompositeOperation='source-in';mg.fillStyle=col||'#08060b';mg.fillRect(0,0,w,h);
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>g.drawImage(m,dx,dy));g.drawImage(src,0,0);return o;
}

function drawRocks(g,x0,y0,x1,y1,r){
  const cols=['#6e5c4c','#57483b','#7d6a58','#4a3d31'];
  for(let i=0;i<Math.max(6,((x1-x0)*(y1-y0))/14);i++){
    const rr=2+(r()*3|0),x=x0+rr+r()*Math.max(1,x1-x0-rr*2),y=y0+rr+r()*Math.max(1,y1-y0-rr*2);
    pcirc(g,x,y,rr+1,'#231b15');pcirc(g,x,y,rr,cols[r()*4|0]);px(g,x-rr+1,y-rr+1,2,1,'#9b8670');
  }
}
function drawNumeral(g,n,cy0){

function drawPortal(g,cx,cy,mode){

    if(d<=10.5&&d>=7){const top=y<-3;px(g,cx+x,cy+y,1,1,top?'#504a5a':y>4?'#1c1922':'#3a3542');}
    else if(d<7)px(g,cx+x,cy+y,1,1,mode==='on'?'#0f3a38':mode==='idle'?'#0a1214':'#060509');}
  const runes=[[-9,-2],[-7,-7],[-2,-10],[4,-9],[8,-5],[9,2],[6,7],[0,9],[-6,7]];
  runes.forEach(([x,y],i)=>px(g,cx+x,cy+y,1,1,mode==='on'?'#7fffe9':mode==='idle'?(i%2?'#2e7a72':'#1f514c'):'#26222c'));
  if(mode==='dead'){pline(g,cx-2,cy-10,cx+1,cy-6,'#0b0a0e');pline(g,cx+1,cy-6,cx-1,cy-3,'#0b0a0e');px(g,cx-9,cy+10,3,1,'#2a2530');px(g,cx+5,cy+11,4,1,'#2a2530');}
  if(mode==='on'){for(let i=0;i<14;i++){const a=i*0.9,r=1+i*.42;px(g,cx+Math.cos(a)*r,cy+Math.sin(a)*r,1,1,i%2?'#7fffe9':'#4aa8ff');}}
}

function renderLadders(){
  const LS=ladderSet();
  if(!UI.ladShown){UI.ladShown=new Set(LS);UI.ladPend=new Set();}
  UI.ladShown.forEach(k=>{if(!LS.has(k))UI.ladShown.delete(k);});
  const fresh2=[...LS].filter(k=>!UI.ladShown.has(k)&&!UI.ladPend.has(k));
  if(fresh2.length){
    const freshCols=new Set([...UI.lastFresh||[]].map(i=>i%COLS));
    const anim=fresh2.filter(k=>freshCols.has(+k.split(',')[0]));
    fresh2.filter(k=>!anim.includes(k)).forEach(k=>UI.ladShown.add(k));
    if(anim.length)unrollLadders(anim);
  }
  let h='',hf='';
  const ledgeAt=new Set(G.chars.filter(c=>onBoard(c)&&c.ledge).map(c=>c.x+','+c.y));
  UI.ladShown.forEach(k=>{
    const [x,y]=k.split(',').map(Number),c=B(x,y);if(!c)return;
    const up=y>0&&eConn(x,y-1)&&UI.ladShown.has(x+','+(y-1)),dn=eConn(x,y)&&UI.ladShown.has(x+','+(y+1));
    const sq=c.t.feat==='squeeze',top=y*CS+(up?0:sq?40:16),bot=y*CS+(dn?CS:82);
    const d=`<div class="lad${c.rubble?' behind':''}${UI.ladAnim&&UI.ladAnim[k]?' '+UI.ladAnim[k]:''}" style="left:${x*CS+34}px;top:${top}px;height:${bot-top}px;background-image:url(${LAD_URL})"></div>`;
    h+=d;if(ledgeAt.has(k))hf+=d;
  });
  document.getElementById('ladders').innerHTML=h;document.getElementById('ladfront').innerHTML=hf;
}
function unrollLadders(list){
  UI.ladAnim=UI.ladAnim||{};
  const base=(UI.lastFresh?UI.lastFresh.length:1)*110+520;let maxd=0;
  // výchozí bod: žebříková destička ve sloupci
  list.forEach(k=>{
    const [x,y]=k.split(',').map(Number);
    let ys=null;for(let yy=0;yy<ROWS;yy++){const c=B(x,yy);if(c&&c.t.kind==='stairs'&&(ys==null||Math.abs(yy-y)<Math.abs(ys-y)))ys=yy;}
    if(ys==null)ys=y;
    const d=Math.abs(y-ys),dir=y<ys?'gup':'gdn';maxd=Math.max(maxd,d);UI.ladPend.add(k);
    setTimeout(()=>{
      if(!UI.ladShown)return;UI.ladPend.delete(k);UI.ladShown.add(k);UI.ladAnim[k]=y===ys?'gdn':dir;
      const c=B(x,y);
      if(c&&vConn(x,y)&&ledgeKind(c.t,c)){
        particles((x+.5)*CS,y*CS+62,14,['#8b6440','#b4874f','#4b331f'],{grav:1,a0:-Math.PI,spread:Math.PI,sp:46,w:40,h:4,t:.9,sz:4,fall:120});
        SF('slam',.35);
      }else SF('clink');
      renderCells();renderLadders();
      setTimeout(()=>{if(UI.ladAnim)delete UI.ladAnim[k];},500);
    },base+d*280);
  });
  UI.holdTok=Math.max(UI.holdTok||0,performance.now()+base+maxd*280+420);
}

/* ================= KAMERA ================= */
function viewSize(){const v=document.getElementById('view');return {w:v.clientWidth,h:v.clientHeight};}
function zLimits(){const {w}=viewSize(),bw=(COLS+1)*CS;return {min:w/(bw*1.1),fit:w/(bw*1.03),max:w/(bw*1.03)*2.2};}
function clampCam(){
  const {w,h}=viewSize(),c=UI.cam,L=zLimits();
  c.z=Math.max(L.min,Math.min(L.max,c.z));
  const bw=COLS*CS*c.z,bh=ROWS*CS*c.z,gw=CS*c.z/2,topPad=70;
  if(bw+2*gw<=w)c.x=(w-bw)/2; else c.x=Math.min(gw,Math.max(w-bw-gw,c.x));
  const over=CS*c.z*.6;   // kousek nad první a pod poslední patro
  if(bh+topPad<=h){const mid=topPad+(h-topPad-bh)/2;c.y=Math.min(mid+over,Math.max(mid-over,c.y));} else c.y=Math.min(topPad+over,Math.max(h-bh-over,c.y));
}
function applyCam(smooth){
  clampCam();const b=document.getElementById('board');b.classList.toggle('smooth',!!smooth);
  const c=UI.cam;b.style.transform=`translate(${c.x}px,${c.y}px) scale(${c.z})`;
  renderOffs();
}
function renderOffs(){
  if(!UI.ready||!G)return;const {w,h}=viewSize(),c=UI.cam,m=24;let o='';
  G.chars.forEach(ch=>{
    if(!onBoard(ch))return;const px2=(ch.x+.5)*CS*c.z+c.x,py=(ch.y+.5)*CS*c.z+c.y;
    if(px2>=0&&px2<=w&&py>=0&&py<=h)return;
    const ax=Math.max(m,Math.min(w-m,px2)),ay=Math.max(m+60,Math.min(h-m,py));
    const dir=py<0?'top':py>h?'bottom':px2<0?'left':'right';
    const arr={top:'top:-14px;left:10px;border-bottom-color:',bottom:'bottom:-14px;left:10px;border-top-color:',left:'left:-14px;top:10px;border-right-color:',right:'right:-14px;top:10px;border-left-color:'}[dir];
    o+=`<button class="offa" data-focus="${ch.id}" style="left:${ax}px;top:${ay}px;border-color:${ch.color}" title="${ch.name}">${portraitSVG(ch)}<i style="${arr}${ch.color}"></i></button>`;
  });
  const oe=document.getElementById('offs');if(oe._o!==o){oe._o=o;oe.innerHTML=o;}   // přepisovat jen při změně, jinak tah kamerou trhá
}
function centerOn(x,y,smooth){const {w,h}=viewSize(),c=UI.cam;c.x=w/2-(x+.5)*CS*c.z;c.y=h/2-(y+.5)*CS*c.z;applyCam(smooth);}

function camVisible(x,y){const {w,h}=viewSize(),c=UI.cam,px2=c.x+(x+.5)*CS*c.z,py=c.y+(y+.5)*CS*c.z;return px2>CS*c.z*.4&&px2<w-CS*c.z*.4&&py>CS*c.z*.4&&py<h-CS*c.z*.6;}
function focusBox(pts){if(!UI.autoCam||!pts.length)return;if(pts.every(p=>camVisible(p[0],p[1])))return;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const {w,h}=viewSize(),L=zLimits();let z=Math.min(UI.cam.z,(w*.85)/((x1-x0+1.4)*CS),(h*.8)/((y1-y0+1.4)*CS));z=Math.max(L.min,Math.min(L.max,z));

function seqPoints(list){const pts=[];list.forEach(s=>{if(s.x!=null&&s.y!=null)pts.push([s.x,s.y]);if(s.cells)s.cells.forEach(i=>pts.push([i%COLS,(i/COLS)|0]));

function zoomAt(f,px2,py,smooth){const c=UI.cam,L=zLimits(),nz=Math.max(L.min,Math.min(L.max,c.z*f));c.x=px2-(px2-c.x)*nz/c.z;c.y=py-(py-c.y)*nz/c.z;c.z=nz;applyCam(smooth);}

function setupCamera(){

  v.addEventListener('pointerdown',e=>{if(e.button!==0||UI.playing)return;Pp={y:e.clientY,x:e.clientX,cy:UI.cam.y,cx:UI.cam.x,moved:false};});
  window.addEventListener('pointermove',e=>{

  try{UI.autoCam=localStorage.getItem('hlubina-autocam')!=='0';}catch(e){UI.autoCam=true;}
  const za=document.getElementById('zAuto');za.classList.toggle('on',UI.autoCam);
  za.onclick=()=>{UI.autoCam=!UI.autoCam;za.classList.toggle('on',UI.autoCam);try{localStorage.setItem('hlubina-autocam',UI.autoCam?'1':'0');}catch(e){}};
  document.getElementById('zFocus').onclick=()=>{const c=G.active!=null?G.chars[G.active]:G.chars.find(onBoard);if(c){fitWidth();centerOn(c.x,c.y,true);}};
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{applyCam(false);},100);});
}

/* ================= MENU, ULOŽENÍ, PRAVIDLA ================= */
const VERSION='0.67';
const CHANGELOG=[
  ['0.67','Pasti, střílny a animace',['Běžná událost už nemá razítko SPUŠTĚNO, razítko dostane jen kritický zásah a dynamit.','Past chytí i toho, kdo do ní propadá, a zavře se až ve chvíli, kdy je postava uvnitř. Chytí i přízrak. Dveře se otevírají pohybem zvenku do pasti (značka na poli), už to není speciální akce.','Střílna střílí jen při vstupu do laseru (při každém), přímo na jejím poli je mrtvý úhel. Před výstřelem se rozblikají červené diody, pak buď vystřelí, nebo se zeleně rozsvítí i s laserem.','Karanténa, ke které se přízrak vydá, se rozsvítí a zabzučí. Prasklé potrubí při zvednutí vody blikne a roztočí ventil.','Jádro radiace: kratší kaskáda od jádra do okolí, zasažená postava sebou trhne a ztracená akce je v profilu světle zelená.','Opraveno: pohyb před vyčerpáním (třeba šplhání po laně) se přehrával jako běh a teprve pak se postava chytila lana.','Karty událostí už po najetí neukazují systémový tooltip (text je na kartě). Tutoriál: kamera v klidu přejede k zóně a portálu, u vody je vysvětleno, že na konci kola klesá o patro.']],
  ['0.66','Multiplayer pro 4',['Lokální multiplayer pro 2–4 hráče. Ve čtyřech se hraje lehká obtížnost (každý má 1 postavu), ve třech lehká nebo normální. Když se přihlásí víc hráčů, obtížnost se sama upraví.','Při pokračování ve výpravě se mezi hráče rozdělí jen živé postavy.','Nové hlavní menu: na tmavém pozadí je minimalistický plán bočního řezu laboratoře, po stranách občas zabliká světlo a shora občas padá suť. Výraznější tlačítka, hra už pod menu neprosvítá.','Na plánu laboratoře víc druhů poznámek (žluté lístky, útržky s páskou, linkované kartičky, zakroužkovaná varování), 30 textů, a nepřekrývají místnosti.','Víc jmen pro postavy (přes 70).','Přepsaná pravidla: všechny strany stejně vysoké, aktuální obrázky dílků (oheň, radiace, přízrak, žebřík, lano…), základní hra v kapitolách 1–12 a vše, co přichází až během výpravy, stručně v Extra pravidlech. Nová strana Ovládání. V pravidlech jde listovat LB / RB.','Tutoriál jde celý ovládat ovladačem: tlačítka Další / Rozumím potvrdí A, v bublině je nápověda k ovladači.','Test room (v hlavním menu): asi 50 dílků se vším, co hra má, volba typu levelu, počtu postav, schopností III a hry bez časového limitu.']],
  ['0.65','Světová tabulka a životy podle obtížnosti',['Skóre se po konci výpravy odešle do světové tabulky na lygames.cz. Tabulka výprav ukazuje světovou top 10 i výpravy z tohoto prohlížeče.','Max. životy podle obtížnosti: lehká 5, normální 6, těžká 7. Sérem jde doplnit nejvýš na toto maximum.','Ovladač: dílek jde otáčet i tlačítky LB / RB.']],
  ['0.64','Razítka a názvy',['Jednotné razítko pro mapu i události, výraznější na kartě levelu. Nové názvy typů: Tma, Dvojitý zámek, Na dohled, Dusno. Řady bez kyslíku jsou šedé a desaturované.']],
  ['0.63','Typy levelů',['Každá místnost v patře 3 má typ levelu (ikonka na plánu, popis v potvrzení): Ztracení, Tma, Dvojitý zámek, Na dohled, Úprk, Dusno. Vybraný typ se už ve výpravě neobjeví.','Patro 4: vybraná událost má vždy kritický zásah a normálně se vyčerpá. Na plánu má místnost razítko KRITICKÉ ×2, v liště karta značku ×2.','Všechny události dostanou při spuštění razítko (SPUŠTĚNO / KRITICKÉ ×2).']],
  ['0.62','Ladění',['Hasič: oheň zhasne až ve fázi zranění, v kouři a páře. Menší text „uhašeno“.','Zával se zastaví nad krytem, neprojde jím.','Maximum je 6 životů (sérem nejde přes 6) a čas na level 25 kol.','Startovní balíček má o 1 slepou uličku s ohněm víc.','Opraveno: popis radiace se při kritickém zásahu ukázal dvakrát, a pohyb s vyčerpáním po skoku.','Pravou páčkou jde posouvat plán laboratoře.']],
  ['0.61','Čas za sérum, Doktor',['Za sérum jde v obchodě natrvalo přidat +1 kolo k času na level. Cena 1, 2, 3 … ampule a roste zvlášť (nezávisle na nákupu životů).','Doktor I a II: bonus k ošetření a zvednutí má 75% šanci (dřív 50 %).']],
  ['0.60','Obtížnosti',['Obtížnost: lehká (4 postavy, skóre × 0,75), normální (3), těžká (2 postavy, skóre × 1,5). Vybírá se před výpravou.','Multiplayer pro 2–3 hráče: postavy se rozdělí dokola (lehká ve dvou 2+2, normální ve dvou 2+1, těžká 1+1). Kdo má dvě postavy, přepíná LB/RB.','Obchod: vybraná schopnost jde položit už jen na volné sloty (zvýrazněné), ovladačem se chodí po řádcích (životy, sloty, nabídka, tlačítka). Cena za +1 max. život roste společně pro všechny. Koupený život se rozsvítí, sérum se načítá animací.','Opraveno: sérum za level se nepřičítalo a panika nehrála animaci. Sražení v levelu už nesnižuje max. životy.','Hasič: 3/5/7 hašení za level, oheň na svém poli uhasí místo zranění (žádná akce). Panika není nikdy kritická.','Kyslík potápěče je vidět vždy a ubývá až ve fázi zranění. Pohyb do vody s vyčerpáním se nejdřív dohraje. Zával strhne s sebou i přízrak. Ošetření: sebe jako první, cíl se zvýrazní.']],
  ['0.59','Multiplayer doladění, laboratoř a hasič',['Barva hráče je barva jeho postavy (P1/P2/P3, označení, obchod). Připraven svítí. Tlačítka ovladače mají barevné kulaté ikony A/B/X/Y.','Opraveno: podržené B občas neukončilo tah a B se muselo mačkat dvakrát. Y menu už neskáče zpátky na dynamit. Výběr cíle páčkou funguje správně i přes okraj jeskyně.','V obchodě je označení v barvě hráče a potvrzení nákupu je velké a bliká.','Přízrak vylézá z díry v doupěti.','Regenerační laboratoř: kdo v ní ukončí tah, +3 životy (sraženého postaví). Pod vodou nefunguje.','Hasič je imunní vůči ohni, jen dokud mu zbývá hašení. Tečky hašení jsou i pod životy postavy.','Sérum: vždy +1 a k tomu +1 za každou živou postavu, která neprošla portálem.','Z úzkého koridoru se dá chytit lana, které jím prochází (místo seskoku).']],
  ['0.58','Sérum, smrt až na konci levelu, lana a ladění',['Nová měna: ampule séra. Za každý level, ze kterého někdo unikne, +1. Nová příznivá místnost Sklad séra (2 slepé uličky s ampulí). V obchodě si každá postava koupí +1 max. život (max. 7) za 1, 2, 3 … ampule.','V levelu se už neumírá. Sražená postava se dá vždy zvednout (na 1 max. životu už ho nesnižuje). Kdo na konci levelu přijde o poslední max. život, je ztracen navždy a místo životů má lebku.','Opraveno zaseknutí, když se poslední postava sama zasypala dynamitem.','Lano se protáhne co nejníž po každé změně terénu (vykopaný zával, výbuch) a jde hodit i nad lano, které už v šachtě visí: lana se spojí. Postava se lana chytí až po ukázání výsledku hodu.','Antiradiace +15 / 30 / 45 % (i proti jádru). Kantýna funguje i pod vodou. Potápěč má kyslík zpátky, jakmile vyleze z vody.','Patro 4: událost s kritickou šancí se po spuštění nevyčerpá. Jádro radiace se při kritickém zásahu spustí dvakrát a má výraznější animaci.','Deník ukazuje hody: např. „hod 76/100, uspěje při ≤ 70“.','5A ve 3. aktu dává vítězství místo sošky. Plán laboratoře je s každým aktem tmavší, mokřejší a potrhanější. Popisy speciálních destiček v potvrzení mise, střílna v balíčku se zbraní, kratší tooltipy vylepšení, kyslík jako tečky.']],
  ['0.57','Lokální multiplayer na ovladače',['V menu nově Hra pro jednoho a Multiplayer. Multiplayer počká na 3 ovladače, každý hráč zmáčkne A, vybere si postavu (◀ ▶) a X vylosuje jiné jméno.','Ve hře: A aktivuje tvou postavu, páčka vybere cíl, A provede, Y otevře speciální akce, B zpět nebo deaktivace (jen když jsi ještě nic neudělal), podržené B ukončí tah. View vrací krok, Start (vedoucí) ukončí kolo.','Kameru ovládá aktivní hráč (nebo kdokoli, když nikdo nehraje): pravá páčka posun, RT přiblížit, LT oddálit.','Plán, menu a dialogy ovládá vedoucí (hráč 1). V obchodě nakupuje každý jen sobě: A označí, druhé A koupí, Hotovo až všichni.','Ovladač funguje i v single playeru: A vybere postavu, LB/RB přepínají.']],
  ['0.56','Kantýna a prasklé potrubí',['Nová příznivá místnost Kantýna: kdo v ní ukončí tah, začne příští kolo se 2 žlutými akcemi navíc.','Nová extra destička Prasklé potrubí (rovinka): kdokoli do ní vstoupí, i přízrak, voda stoupne o patro.','Protiatomový kryt je pancéřovaný: dynamit ho neprorazí zvenku ani zevnitř.','Postava, která zemře nebo přijde o všechny max. životy, je ztracená do konce výpravy.','Skóre a Tabulka výprav: 100 × nejhlubší level + 25 × získané sošky + 15 × zbylé max. životy, za vítězství +500.']],
  ['0.55','Schopnosti III, extra destičky a akty',['Schopnosti mají 3 úrovně (vylepšení na II za 2, na III za 3) a po najetí ukážou další úrovně. Koupená schopnost se nepřepisuje a postava ji nemůže mít dvakrát. Schopnost, kterou už někdo má, se nabízí méně.','Nově: Lezec III lano za 1 akci, Střelec střílí až 2 pole, Stopař vrací nevybraný dílek do balíčku, Demolice bez závalu / 2 / 3 dynamity, Hasič je vůči ohni imunní a hasí jako akci, Antiradiace III imunita, Doktor III vždy +2.','Pozitivní místnost, kterou si vybereš, se v dalších aktech nenabídne. Nová pozitivní místnost: Protiatomový kryt. Karanténa přízraky láká.','Od 2. aktu patro 3 přidává extra destičky: střílnu, past se dveřmi, sliz a jádro radiace. V 3. aktu už dvě.','Patro 5: start uprostřed nad vodou, zařízení v posledních třech patrech. Po 3. aktu je vítězství.']],
  ['0.54','Ladění',['Ukončit kolo se musí potvrdit, když má někdo ještě běžné akce.','Teleport: postava zmizí v záblesku a v záblesku se objeví, už nepřelétá přes mapu. Na obsazená prkna se neteleportuje, chytí se lana, nebo spadne.','Lano nad žebříkem končí na jeho horní hraně.','Potápěč má kyslík 2 / 4.','Kritický zásah má šanci 10 %, v nepřátelských místnostech 35 %.','Patro 3: soška už se nenabízí, žebřík jen vzácně, vždy s ošklivou destičkou a nikdy uprostřed (3B). Prostřední místnost je ošklivější a někdy přidá dvě nebezpečné destičky.','Plán: prošlé místnosti na 75 % barev, při najetí se žlutě zakroužkuje číslo a fotka se zvedne, prošlá cesta svítí žlutě, provázky jsou silnější. Opravené míchání fotek mezi runy.','Opravy: postava klesala s vodou dřív, než voda opadla. Prkna pod vodou nezmizí. Zasypaná radiace má dál ikonku. Na laně a prknech ve stejné šachtě stojí postavy u sebe správně. Plynulejší posun kamery.']],
  ['0.53','Neúspěch není konec',['Když portálem nikdo neprojde (všichni padnou, nebo se ztratíte), výprava pokračuje dál. Nevynesete žádnou sošku, jen případnou odměnu levelu, a všem ubude 1 maximální život. Run končí, až když nikdo nežije.']],
  ['0.52','Opravy a kamera',['Opraveno: po načtení stránky se uložená výprava přepsala úvodní hrou, takže Pokračovat vracelo na začátek.','Automatická kamera (tlačítko A vpravo dole) při událostech odjede a odzoomuje, aby bylo vidět dění, u radiace přejede za každou postavou.','Voda začíná v polovině výšky jeskyně.','Rozmyslel sis výběr? Kliknutím na původní postavu se k ní vrátíš.','Opraveno: v rovné svislé šachtě se postava po opadnutí vody držela, jako by tam byla prkna.','Ve vodě s lanem má přednost plavání.']],
  ['0.51','Konec levelu a obchod',['Po levelu se nasčítají sošky: odměna a ty, které kdo vynesl, přiletí do součtu. Kdo neprošel portálem, má nad hlavou hvězdičky a škrtne se mu život. Pak se odkryje obchod.','Schopnosti, na které máš, svítí. Schopnost se bere do ruky jako karta a pokládá na slot.','Z vody už se nedá vyplavat nad hladinu, jen po laně nebo žebříku.','Opadnutí poslední vrstvy vody je animované. Postavy, které ještě můžou hrát, mají v panelu bílý okraj.','Když se karty událostí obnovují, nejdřív zešedne a proběhne poslední karta, teprve pak se všechny obnoví.','Postava padá k zemi až po animaci zranění. Texty jsou zalamované po větách.','Uložené výpravy ze starších verzí jdou dohrát. Test room je z menu pryč.']],
  ['0.50','Vyšetřovací tabule',['Místnosti na plánu mají přišpendlené pixelartové fotky interiérů (vstupní hala, reaktor, teleporty, hořící chodby…), druhý úhel záběru, fotku vědce (nebo přízraku) a lístek s poznámkou. Prošlou cestu spojuje červený provázek.','Ruka ukazuje na každou místnost, na kterou najedeš. Místnosti, kam zatím nemůžeš, se rozsvítí barvou jen na čtvrtinu.','Větší lístek s informacemi i s fotkou.','Levely jsou číslované podle hloubky (v dalším aktu 6, 7, 8…) a mají krátký kód jako 2_lab_delta.','Po kliknutí na místnost se otevře lísteček s krátkým příběhem, co dostaneš, případným varováním a velkými destičkami. Teprve tlačítko Vstoupit level spustí.','Plán je tmavší, jako by ho člověk četl dole pod zemí.','Destičky, které místnost přidá, jsou na plánu větší, plně barevné a pohozené přes fotku. Patro 4 má na fotce fixou červený vykřičník s událostí, která tam má kritický zásah.','Plán je čistší: fotka místnosti je přímo v jejím rámečku a kolem ní jen 0–2 drobnosti (výřez, vědec, lísteček).','Teleport víc svítí a víří, regenerační komora má kabely, stůl s baňkami, menší nalomený sloup a zelenou záři, karanténa je elektrické pole s výboji mezi emitory a nenápadnými pruhy. Každá má vlevo nahoře ikonku s popiskem.']],
  ['0.49','Plán na papíře',['Plán sektoru je velký zažloutlý papír s přehyby, skvrnami, poznámkami a razítky, dá se po něm scrollovat.','Místnosti jsou nákresy. Šedé, po najetí se obarví podle tématu (oheň červeně, radiace zeleně…), prošlé zůstanou napůl barevné.','Ruka je velká a rukáv vede až mimo záběr.','Popisy místností už neřeší tvar destiček, ten je vidět v náhledu.']],
  ['0.48','Plán laboratoře',['Nová výprava začíná na plánu sektoru: 5 pater, místnosti propojené čarami, ruka ukazuje, kam sestoupíš.','Za level už není soška zdarma, jen 1A a 5A dávají sošku navíc. 5A natrvalo prohloubí jeskyni o patro.','Patro 2: teleporty, karanténa, regenerační komora, depozitář soch. Patro 3: neutrální místnosti s vyváženými destičkami. Patro 4: nebezpečné destičky a 30% kritický zásah jedné události.','Destičky z místností zůstávají v balíčku po celý run. Po 5A pokračuje další akt.']],
  ['0.47','Tutoriál potřetí',['Zvednutá postava má v tom kole už jen 1 akci (+ vyčerpání).','Záblesk zásahu se už neopakuje při každém pohybu.','Tutoriál: nápověda k ovládání kamery, k zařízení se jde přes doupě přízraků (přízrak se zrodí v kole, kdy ho odhalíte), dynamit zasype cestu zpátky a vyzkoušíš si kopání. Události Zával se v tutoriálu nespouští.','Bublinu o Matějovi jde zavřít, nápovědy se už nepřekřikují se scénářem.','Tutoriál vysvětlí sraženou postavu, když se to stane poprvé.']],
  ['0.46','Čitelnost',['Karty událostí jsou širší a v bodech, nápovědy v tutoriálu mají každou větu na vlastním řádku.','Odhalit jde jen tam, kam se dá něco položit. Prázdný balíček svítí červeně.','Sražená postava může projít portálem (1 akce). Ukončit kolo je zašedlé, když už všichni táhli.','Postava při pohybu neproblikne.','Voda začíná vždy 2 patra pod startem (v tutoriálu ne).','Tutoriál: odbočka vlevo od žebříku, portál se neprozradí dřív, než ho najdete, Matěj čeká, dokud ho nezvednete, a bez něj portálem neodejdete.']],
  ['0.45','Tutoriál podruhé',['Tutoriál s postavami Tomáš, Dima a Matěj: po nalezení druhé postavy jasný úkol (portál a zařízení v zóně) a volnější hra s nápovědami, které vyskočí, když na něco narazíte.','Matěje je potřeba vysvobodit dynamitem. Výbuch spustí zával a pošle ho do vody, pak je to naostro s náhodnými událostmi a málem času.','V tutoriálu se tah ukončuje vždy ručně. Tlačítko Dál spolehlivě reaguje.']],
  ['0.44','Tutoriál',['V menu je tutoriál: připravená výprava, která krok za krokem ukáže odhalování, pohyb, vyčerpání, koridor, průzkum, otáčení, prkna, pád, radiaci, žebřík, lano, léčení, sošky, události, přízraky, oheň, zával, zařízení, portál a nákup schopností.','V tutoriálu se zvednutí neprojeví na maximu životů.']],
  ['0.43','Drobnosti v koridoru',['Kde šachtou vede lano, skok z prken se nenabízí, jen lano.','Vodorovný koridor má pochroumanou hrbolatou podlahu.','V koridoru se svislým otvorem je postava zapřená o stěny (i v T a křižovatce), póza je statická.','Do koridoru i z něj se postava bokem vplazí a vyplazí.']],
  ['0.42','Koridor T',['Lano projde celým koridorem a jde ho spustit i přímo z koridoru.','Postava v koridoru je zapřená rukama o stěny a při pádu se rovnou zapře (bez rozplácnutí).','Náraz v koridoru: nejdřív zranění z pádu, pak oba −1, pak vyšoupnutí a zranění z jeho pádu.','Dynamit z koridoru udělá koridor T (svislý i vodorovný zároveň), bez prken a se správným vzhledem.','Tlačítko Ukončit kolo po kliknutí blikne.']],
  ['0.41','Svislý úzký koridor',['Úzký koridor může být i svislý. Šachta jím pokračuje, žebřík skrz něj nevede, lano ano.','Pád se v koridoru zastaví a zranění se počítá jen po koridor. Kdo do obsazeného koridoru spadne, oba dostanou −1 a původní postava vyletí dolů.','Z koridoru dolů: žebřík chytí (pokud na něm nikdo není), jinak pád jako ze skoku. Nahoru jen po žebříku těsně nad koridorem nebo po laně.','Sražený koridorem propadne až dolů.','Test room v menu: připravená mapa se dvěma šachtami s koridorem.']],

function fmtL(t){const parts=String(t).split(/(?<=[.!?])\s+(?=[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ0-9+(„])/);const out=[];
  parts.forEach(p=>{const l=out.length?out[out.length-1]:null;if(l&&l.length+p.length<46&&l.length<26)out[out.length-1]=l+' '+p;else out.push(p);});

function migrateRun(){
  if(RUN.act==null)RUN.act=1;if(!RUN.diff)RUN.diff=RUN.chars.length>=4?'easy':RUN.chars.length<=2?'hard':'normal';RUN.chars.forEach(r=>{const cap=Math.max(hpCap(),HP_CAP);if(r.permMax>cap)r.permMax=cap;});if(RUN.hpBuys==null)RUN.hpBuys=RUN.chars.reduce((a,r)=>a+(r.hpBuys||0),0);if(RUN.serum==null)RUN.serum=0;if(RUN.act>=3&&RUN.map&&RUN.map.nodes['5A']&&RUN.map.nodes['5A'].gem){Object.assign(RUN.map.nodes['5A'],{gem:false,win:true,short:'poslední level · vítězství',name:'Srdce reaktoru',desc:'Poslední level celé výpravy. Kdo projde portálem, dovede výpravu k vítězství.'});}if(RUN.gemsTotal==null)RUN.gemsTotal=RUN.gems||0;if(RUN.maxLvl==null)RUN.maxLvl=0;if(RUN.depth==null)RUN.depth=0;if(!RUN.extra)RUN.extra=[];if(!RUN.path)RUN.path=[];
  if(!RUN.map){RUN.map=genMap();const lv=Math.max(1,Math.min(5,RUN.level||1));RUN.path=MAP_TIERS.slice(0,lv).map(t=>t[0]);RUN.pos=RUN.path[RUN.path.length-1];}
  Object.values(RUN.map.nodes).forEach(n=>{if(n.num==null)n.num=(RUN.act-1)*5+n.tier;if(!n.tag)n.tag=n.id.toLowerCase();if(!n.short)n.short='';if(!n.theme)n.theme=n.pool==='start'?'start':n.pool==='final'?'final':n.room?(n.pool==='hos'?'h_'+n.room:n.room):'dead';});
}

}

`<h3>4. Odhalování dílků</h3><p>Odhalit lze jen tam, kam vede otevřená chodba. Dílek musí na napojení navazovat, jinak ho natočíte, jak chcete.</p>
