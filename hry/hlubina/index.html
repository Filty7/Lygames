/* ---------- pozadí menu: minimalistický blueprint bočního řezu laboratoře, blikající světla, padající suť ---------- */
let MBG={lights:[],deb:[],next:0,last:0,cv:null,W:0,H:0};
function menuBgBuild(){
  let bg=document.getElementById('mbg');
  if(!bg){bg=document.createElement('div');bg.id='mbg';bg.hidden=true;document.body.insertBefore(bg,document.body.firstChild);}
  const W=Math.max(innerWidth,800),H=Math.max(innerHeight,600),R=Math.random,r1=(a,b)=>a+R()*(b-a);
  let l='',t='',fill='';const ln=(x1,y1,x2,y2,c)=>{l+=`<line x1="${x1|0}" y1="${y1|0}" x2="${x2|0}" y2="${y2|0}"${c?` class="${c}"`:''}/>`;};
  const rc=(x,y,w,h,c)=>{l+=`<rect x="${x|0}" y="${y|0}" width="${w|0}" height="${h|0}"${c?` class="${c}"`:''}/>`;};
  const tx=(x,y,s,c)=>{t+=`<text x="${x|0}" y="${y|0}"${c?` class="${c}"`:''}>${s}</text>`;};
  /* povrch s šrafováním */
  const gy=Math.round(H*.09);ln(0,gy,W,gy,'b');for(let x=-20;x<W;x+=14)ln(x,gy,x+10,gy-10,'h');
  tx(18,gy-16,'POVRCH ±0 m','lb');
  /* patra */
  const FH=Math.round(r1(108,128)),floors=[];for(let y=gy+FH;y<H+FH;y+=FH)floors.push(y);
  floors.forEach((y,k)=>{ln(0,y,W,y,'b');ln(0,y+6,W,y+6,'t');tx(14,y-8,`−${(k+1)*10} m`,'lb');});
  /* šachty: hlavní uprostřed + po stranách */
  const shafts=[W*.5|0,(W*r1(.08,.16))|0,(W*r1(.84,.92))|0,(W*r1(.24,.32))|0,(W*r1(.68,.76))|0];
  shafts.forEach((x,k)=>{const top=k<3?gy:floors[Math.floor(R()*2)],bot=k===0?H+10:floors[Math.min(floors.length-1,2+Math.floor(R()*(floors.length-2)))]+6,w=k===0?54:34;
    fill+=`<rect x="${x-w/2}" y="${top}" width="${w}" height="${bot-top}" class="sh"/>`;ln(x-w/2,top,x-w/2,bot,'b');ln(x+w/2,top,x+w/2,bot,'b');
    if(R()<.6||k===0){for(let y=top+8;y<bot;y+=10)ln(x-8,y,x+8,y,'t');ln(x-8,top,x-8,bot,'t');ln(x+8,top,x+8,bot,'t');}
    else ln(x,top,x,top+r1(80,bot-top),'rope');
    if(k===0){tx(x+w/2+6,gy+18,'ŠACHTA A','lb');}});
  /* místnosti mezi šachtami na každém patře */
  floors.forEach((y,k)=>{let x=40+R()*40;while(x<W-60){const w=r1(90,230);if(shafts.some(sx=>sx>x-30&&sx<x+w+30)){x+=40;continue;}
      if(R()<.62){const h=FH-6;rc(x,y-h,w,h,'rm');const typ=R();
        if(typ<.25){for(let q=0;q<3;q++){const bx=x+12+q*(w-24)/3;rc(bx,y-34,(w-24)/3-8,34,'t');}}
        else if(typ<.45){l+=`<circle cx="${(x+w/2)|0}" cy="${(y-h/2)|0}" r="${Math.min(22,h/3)|0}" class="t"/>`;ln(x+w/2-30,y-h/2,x+w/2+30,y-h/2,'t');}
        else if(typ<.6){ln(x,y-h*.55,x+w,y-h*.55,'pipe');ln(x,y-h*.55+5,x+w,y-h*.55+5,'pipe');}
        else if(typ<.72){for(let q=0;q<5;q++)l+=`<circle cx="${(x+r1(10,w-10))|0}" cy="${(y-r1(4,16))|0}" r="${r1(3,7)|0}" class="t"/>`;}
        if(R()<.5)tx(x+6,y-h+14,pick(['B-07','LAB-3','SKLAD','SERVER','KANTÝNA','KARANTÉNA','REAKTOR','ČERPADLA','KRYT','DOZIMETRIE','ARCHIV','T-01']),'lr');
        /* kóta */
        if(R()<.25){ln(x,y-h-10,x+w,y-h-10,'d');ln(x,y-h-14,x,y-h-6,'d');ln(x+w,y-h-14,x+w,y-h-6,'d');tx(x+w/2-12,y-h-14,`${(w/10).toFixed(1)} m`,'ld');}}
      x+=w+r1(20,70);}});
  /* praskliny */
  for(let q=0;q<7;q++){let x=R()*W,y=gy+R()*(H-gy),d='M'+(x|0)+' '+(y|0);for(let s2=0;s2<5;s2++){x+=r1(-24,24);y+=r1(6,22);d+=' L'+(x|0)+' '+(y|0);}l+=`<path d="${d}" class="cr"/>`;}
  /* razítko / titulní blok */
  t+=`<g class="tb" transform="translate(${W-230},${H-84})"><rect width="210" height="64"/><line x1="0" y1="22" x2="210" y2="22"/><line x1="0" y1="43" x2="210" y2="43"/><text x="8" y="16">LAB 7 — SEKTOR HLUBINA</text><text x="8" y="37">boční řez · 1:200</text><text x="8" y="58">list ${1+Math.floor(R()*9)}/9 · 1987</text></g>`;
  bg.innerHTML=`<svg class="mbgbp" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="none"><defs><pattern id="mbggrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" class="g"/></pattern></defs><rect width="100%" height="100%" fill="url(#mbggrid)"/>${fill}<g class="ls">${l}</g><g class="tx">${t}</g></svg><div class="mbglights"></div><canvas class="mbgdeb"></canvas><div class="mbgvig"></div>`;
  /* světla z boku: lampy, alarmy, jiskry */
  const lw=bg.querySelector('.mbglights');MBG.lights=[];
  for(let q=0;q<7;q++){const side=q%2,x=side?r1(.74,.98)*W:r1(.02,.26)*W,y=r1(.12,.95)*H,kind=pick(['lamp','lamp','teal','alarm','rad']),el=document.createElement('i');
    el.className='mbgl '+kind;el.style.left=(x|0)+'px';el.style.top=(y|0)+'px';lw.appendChild(el);MBG.lights.push({el,next:performance.now()+r1(500,6000)});}
  const cv=bg.querySelector('canvas');cv.width=W;cv.height=H;MBG.cv=cv;MBG.W=W;MBG.H=H;MBG.deb=[];MBG.next=performance.now()+r1(1500,3500);
}
function mbgSpawn(){const W=MBG.W,R=Math.random,side=R()<.75,x=side?(R()<.5?R()*W*.3:W*.7+R()*W*.3):R()*W,n=6+Math.floor(R()*12);
  for(let q=0;q<n;q++)MBG.deb.push({x:x+(R()-.5)*40,y:-10-R()*60,vx:(R()-.5)*30,vy:R()*40,s:R()<.3?3:2,c:R()<.5?'#8a8070':'#5a5248',dust:false});
  for(let q=0;q<10;q++)MBG.deb.push({x:x+(R()-.5)*60,y:-4,vx:(R()-.5)*20,vy:R()*15+5,s:6+R()*10,c:'rgba(140,130,115,.08)',dust:true,life:1});}
function mbgTick(t){const bg=document.getElementById('mbg');if(!bg||bg.hidden||!MBG.cv){MBG_RAF=0;return;}
  const dt=Math.min(.05,(t-(MBG.last||t))/1000);MBG.last=t;
  MBG.lights.forEach(L=>{if(t<L.next)return;const el=L.el;
    if(el.classList.contains('on')){el.classList.remove('on');L.next=t+(Math.random()<.5?60+Math.random()*120:2500+Math.random()*7000);}
    else{el.classList.add('on');L.next=t+(Math.random()<.6?50+Math.random()*90:600+Math.random()*1800);}});
  if(t>MBG.next){mbgSpawn();MBG.next=t+3500+Math.random()*6500;}
  const g=MBG.cv.getContext('2d');g.clearRect(0,0,MBG.W,MBG.H);
  MBG.deb=MBG.deb.filter(d=>{if(d.dust){d.life-=dt*.35;d.x+=d.vx*dt;d.y+=d.vy*dt;d.s+=dt*14;if(d.life<=0)return false;g.fillStyle=`rgba(140,130,115,${(.07*d.life).toFixed(3)})`;g.beginPath();g.arc(d.x,d.y,d.s,0,7);g.fill();return true;}
    d.vy+=420*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.y>MBG.H+10)return false;g.fillStyle=d.c;g.fillRect(d.x|0,d.y|0,d.s,d.s);return true;});
  MBG_RAF=requestAnimationFrame(mbgTick);}
let MBG_RAF=0;
(function(){
  function sync(){const m=document.getElementById('menu');if(!m)return;let bg=document.getElementById('mbg');
    if(!m.hidden&&!bg){try{menuBgBuild();}catch(e){}bg=document.getElementById('mbg');}
    if(bg){bg.hidden=m.hidden;if(!m.hidden&&!MBG_RAF)MBG_RAF=requestAnimationFrame(mbgTick);}}
  const start=()=>{const m=menuEl();new MutationObserver(sync).observe(m,{attributes:true,attributeFilter:['hidden']});sync();};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else setTimeout(start,0);
  let rt=0;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const bg=document.getElementById('mbg');if(bg){try{menuBgBuild();}catch(e){}}},400);});
})();

const TUTMAP={};
function tm(x,y,kind,feat,e,extra){const ex=Object.assign({},extra||{}),xt=ex.t||{};delete ex.t;TUTMAP[x+','+y]=Object.assign({t:Object.assign({id:'tut'+x+'_'+y,kind,feat:feat||null},xt),e},ex);}
function buildTutMap(){
  for(const k in TUTMAP)delete TUTMAP[k];
  tm(5,0,'straight',null,[0,1,0,1]);
  tm(6,0,'straight','squeeze',[0,1,0,1]);
  tm(7,0,'corner',null,[0,0,1,1],{opts:[[1,0,0,1],[0,0,1,1]]});            // lekce otáčení: musí vést dolů
  tm(7,1,'straight','hazard',[1,0,1,0]);
  tm(7,2,'corner',null,[1,0,0,1],{t:{gem:true}});
  tm(6,2,'stairs',null,[0,1,1,1],{t:{st:{up:false,down:true,h:'EW'}}});
  tm(6,3,'straight',null,[1,0,1,0],{t:{gem:true}});
  tm(5,2,'straight',null,[0,1,0,1]);                                           // slepá odbočka vlevo od žebříku
  tm(4,2,'dead',null,[0,1,0,0],{t:{gem:true}});
  tm(6,4,'T',null,[1,1,0,1]);
  // pravá větev: prkna, oheň, portál
  tm(7,4,'corner',null,[0,0,1,1]);

function keyOf(el){if(!el)return null;const a=[...el.attributes].filter(q=>q.name.startsWith('data-')&&!/^data-(gp|tip)/.test(q.name)).map(q=>`[${q.name}="${CSS.escape(q.value)}"]`).join('');

function shopInput(evs){
  const mb=document.getElementById('mbox'),sec=mb.querySelector('.shopsec');if(!sec||sec.classList.contains('hid'))return;

      const uc=a?upCost(a.lvl):0,nx=a&&a.lvl<ABIL_MAX?[...Array(ABIL_MAX-a.lvl)].map((_,k)=>`${ROMAN[a.lvl+k+1]}: ${ABIL[a.id].desc(a.lvl+k+1)}`).join('\n'):'';
      const tgt=RUN.sel&&!a&&r.alive&&!r.abil.some(q=>q&&q.id===RUN.sel);
      return `<div class="slot ${a?'full':''} ${RUN.sel?(tgt?'tgt':'dim'):''}" data-slot="${r.id}|${i}">${a?`<b>${ABIL[a.id].name} ${ROMAN[a.lvl]}</b><small>${fmtL(ABIL[a.id].desc(a.lvl))}</small>${a.lvl<ABIL_MAX?`<button class="btn up ${RUN.gems>=uc?'aff':''}" data-up="${r.id}|${i}" ${RUN.gems>=uc?'':'disabled'}>Vylepšit na ${ROMAN[a.lvl+1]} · ${uc} ${CUR}</button><span class="uptip">${ROMAN[a.lvl+1]}: ${ABIL_UPS[a.id](a.lvl+1)}</span>`:'<small class="maxl">nejvyšší úroveň</small>'}`:(tgt?`<small class="tgtl">sem: ${ABIL[RUN.sel].name}</small>`:'<small>prázdný slot · přetáhni sem schopnost</small>')}</div>`;}).join('');
    return `<div class="scharc ${r.alive?'':'gone'}" data-sc="${r.id}"><div class="schead"><span class="sport">${portraitSVG(r)}${!g.escaped&&r.alive?'<span class="stun">✦✧✦</span>':''}</span><div><b>${r.name}</b><div class="hp">${hp}</div>${hpBtn}<small>${!r.alive?'ztracen(a) v hlubině':g.escaped?'prošel(a) portálem · plné životy':'neprošel(a) · max −1'}</small></div>${carry?`<span class="carry">${Array(carry).fill(`<i class="cg">${IC.idol}</i>`).join('')}</span>`:''}</div>${r.alive?slots:''}</div>`;
  }).join('');
  const nm=G.node&&RUN.map&&RUN.map.nodes[G.node];
  const fail=!G.over.esc;
  openModal(`<div class="mhead"><h2>${nm?`Level ${G.nodeNum} · ${nm.name}`:`Level ${RUN.level}`} ${fail?'<span class="failt">nezvládnut</span>':'hotov'}</h2><span class="gemsbig"><span id="gemTot">${intro?RUN.gems-RUN.earned:RUN.gems} ${CUR}</span> <span class="serbig" id="serTot">${intro?(RUN.serum||0)-(RUN.serumLvl||0)-(RUN.serumCarried||0):(RUN.serum||0)} ${SER}</span></span></div>
    <div class="tally">${RUN.bonus?`<span class="tl" id="tlBonus">odměna levelu <b>+${RUN.bonus}</b></span>`:''}<span class="tl">vynesené sošky <b>+${RUN.carried||0}</b></span><span class="tl ser">sérum za level <b data-n="${RUN.serumLvl||0}">+${RUN.serumLvl||0}</b></span>${RUN.serumCarried?`<span class="tl ser">vynesené ampule <b data-n="${RUN.serumCarried}">+${RUN.serumCarried}</b></span>`:''}</div>
    ${RUN.sel?`<div class="pickban">Vybráno: <b>${ABIL[RUN.sel].name}</b> · teď klikni na volný slot postavy, které ji koupíš (znovu na schopnost = zrušit)</div>`:''}
    ${fail?`<p class="failn">${fmtL(G.over.lostWay?'Ztratili jste se: dílky došly a k zařízení už nevede cesta. Nikdo neprošel portálem, takže nevynesete žádnou sošku a všem ubude 1 maximální život. Výprava ale jde dál.':'Nikdo neprošel portálem. Nevynesete žádnou sošku a všem ubude 1 maximální život. Výprava ale jde dál.')}</p>`:''}
    <h3>Výprava</h3><div class="schars">${chars}</div>
    <div class="shopsec${intro?' hid':''}"><div class="timerow"><button class="btn hpbuy timebuy ${(RUN.serum||0)>=(RUN.timeBuys||0)+1?'aff':''}" data-a="buytime" ${(RUN.serum||0)>=(RUN.timeBuys||0)+1?'':'disabled'}>⏱ +1 kolo navždy · ${(RUN.timeBuys||0)+1} ${SER}</button><small>čas na level: ${ROUND_LIMIT+(RUN.timeBonus||0)} kol</small></div><h3>Nabídka</h3><p class="hint">${fmtL(`Nová schopnost stojí ${ABIL_NEW} sošky, vylepšení na II stojí ${ABIL_UP}, na III stojí ${ABIL_UP3}. Chyť schopnost a polož ji na volný slot postavy. Koupenou schopnost už nejde přepsat a stejnou schopnost nemůže mít postava dvakrát.`)}</p><div class="offers">${offers}</div>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn primary" data-a="nextlvl">${G.tut?'Dál →':'Na plán laboratoře →'}</button><button class="btn" data-a="close">Prohlédnout</button></div></div>`);
  document.querySelector('#mbox').classList.toggle('shopbox',true);document.querySelector('#mbox').classList.toggle('picking',!!RUN.sel);if(RUN.hpFlash!=null)setTimeout(()=>{RUN.hpFlash=null;},50);
  if(intro){RUN.intro=false;playTally();}
}
// animace výsledku: sošky přiletí z inventáře do součtu, neprošlým se škrtne život, pak se odkryje obchod
async function playTally(){
  const tot=document.getElementById('gemTot');if(!tot)return;let v=RUN.gems-RUN.earned;const set=()=>{tot.innerHTML=`${v} ${CUR}`;tot.classList.remove('bump');void tot.offsetWidth;tot.classList.add('bump');};
  await sleep(500);
  const fly=(from)=>new Promise(res=>{const a=from.getBoundingClientRect(),b=tot.getBoundingClientRect(),f=document.createElement('span');f.className='flygem';f.innerHTML=IC.idol;
    f.style.left=a.left+'px';f.style.top=a.top+'px';document.body.appendChild(f);requestAnimationFrame(()=>{f.style.transform=`translate(${b.right-24-a.left}px,${b.top+4-a.top}px) scale(1.3)`;});
    setTimeout(()=>{f.remove();if(from.classList.contains('cg'))from.style.visibility='hidden';else from.style.opacity='.4';v++;set();SF('clink');res();},620);});
  const bn=document.getElementById('tlBonus');if(bn){bn.classList.add('on');await fly(bn.querySelector('b'));await sleep(150);}
  for(const g of document.querySelectorAll('#mbox .carry .cg')){await fly(g);await sleep(120);}
  await sleep(300);
  const st=document.querySelectorAll('#mbox .hp i.strike');st.forEach(e=>e.classList.add('go'));if(st.length){SF('hurt');await sleep(700);}
  v=RUN.gems;tot.innerHTML=`${v} ${CUR}`;
  // sérum: ampule přiletí do počítadla jedna po druhé
  const st2=document.getElementById('serTot');if(st2){let sv=(RUN.serum||0)-(RUN.serumLvl||0)-(RUN.serumCarried||0);
    for(const b of document.querySelectorAll('#mbox .tl.ser b')){const n=+b.dataset.n||0;b.parentElement.classList.add('on');
      for(let i=0;i<n;i++){await new Promise(res=>{const a=b.getBoundingClientRect(),t=st2.getBoundingClientRect(),f=document.createElement('span');f.className='flygem';f.innerHTML=IC.vial;f.style.left=a.left+'px';f.style.top=a.top+'px';document.body.appendChild(f);
        requestAnimationFrame(()=>{f.style.transform=`translate(${t.right-24-a.left}px,${t.top+4-a.top}px) scale(1.3)`;});
        setTimeout(()=>{f.remove();sv++;st2.innerHTML=`${sv} ${SER}`;st2.classList.remove('bump');void st2.offsetWidth;st2.classList.add('bump');SF('clink');res();},560);});await sleep(90);}}
    st2.innerHTML=`${RUN.serum||0} ${SER}`;}
  const sh=document.querySelector('#mbox .shopsec');if(sh)sh.classList.remove('hid');
}
const ABIL_UPS={diver:l=>`kyslík ${l*2} místo ${l*2-2}`,climber:l=>l===2?'+30 % na lano místo +15 %':'lano stojí jen 1 akci',jumper:l=>`pád o ${l} pole méně bolí`,shooter:l=>l===2?'zásah 80 % / 60 %':'zásah 100 % / 80 %',tracker:l=>`${l} výměny dílku za level`,
  demo:l=>l===2?'2 dynamity':'3 dynamity, výbuch za 1 akci',firefighter:l=>`${2*l+1} hašení za level`,antirad:l=>`odolání +${l*15} % místo +${l*15-15} %`,doctor:l=>l===2?'75 %: +2 navíc':'vždy +2, zvednutý má plné akce'};
const ABIL_IC={diver:'≋',climber:'⥉',jumper:'⤓',shooter:'⌖',tracker:'⇄',demo:'✸',firefighter:'♨',antirad:'☢',doctor:'✚'};
function buyAbility(cid,i,id){
  const r=RUN.chars[cid];if(!r||!r.alive||!RUN.offers.includes(id)||RUN.gems<ABIL_NEW)return;
  if(r.abil[i]||r.abil.some(a=>a&&a.id===id)){SF('hurt');const sl=document.querySelector(`[data-slot="${cid}|${i}"]`);if(sl){sl.classList.remove('shake');void sl.offsetWidth;sl.classList.add('shake');}return;}   // nepřepisuje a nezdvojuje
  RUN.gems-=ABIL_NEW;r.abil[i]={id,lvl:1};RUN.offers=RUN.offers.filter(o=>o!==id);RUN.sel=null;SF('clink');renderShop();
}
function buyTime(){const c=(RUN.timeBuys||0)+1;if((RUN.serum||0)<c){SF('hurt');return;}RUN.serum-=c;RUN.timeBuys=c;RUN.timeBonus=(RUN.timeBonus||0)+1;SF('clink');renderShop();}   /* vlastní škálování ceny: 1, 2, 3 … */
function buyHp(cid){const r=RUN.chars[cid];if(!r||!r.alive||r.permMax>=hpCap())return;const c=(RUN.hpBuys||0)+1;if((RUN.serum||0)<c){SF('hurt');return;}RUN.serum-=c;r.permMax++;RUN.hpBuys=(RUN.hpBuys||0)+1;   // cena roste společně pro celou výpravu
  if(r.lostNow)r.lostNow=false;RUN.hpFlash=cid;SF('clink');renderShop();}
function upgradeAbility(cid,i){const r=RUN.chars[cid],a=r.abil[i];if(!a||a.lvl>=ABIL_MAX)return;const c=upCost(a.lvl);if(RUN.gems<c)return;RUN.gems-=c;a.lvl++;SF('clink');renderShop();}
function resetView(){UI.lag={};SEQ=[];UI.overShown=false;UI.ladShown=null;UI.monInit=false;UI.lastActive=null;UI.wasDown={};
  document.getElementById('tokens').innerHTML='';document.getElementById('mons').innerHTML='';for(const k in MON)delete MON[k];}
function nextLevel(){RUN.level++;RUN.done=false;closeModal();resetView();newGame();render();initCam();SF('portal');}
function setupShopDnD(){
  const mb=document.getElementById('mbox');let drag=null;
  mb.addEventListener('pointerdown',e=>{const o=e.target.closest('[data-offer]');if(!o||e.button!==0)return;
    drag={id:o.dataset.offer,el:o,x0:e.clientX,y0:e.clientY,ghost:null};o.setPointerCapture&&o.setPointerCapture(e.pointerId);});
  mb.addEventListener('pointermove',e=>{if(!drag)return;
    if(!drag.ghost){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;
      if(RUN.gems<ABIL_NEW){drag.el.classList.remove('shake');void drag.el.offsetWidth;drag.el.classList.add('shake');SF('hurt');drag=null;return;}
      const r=drag.el.getBoundingClientRect(),gh=drag.el.cloneNode(true);gh.classList.add('ghostcard');gh.style.width=r.width+'px';drag.dx=e.clientX-r.left;drag.dy=e.clientY-r.top;
      document.body.appendChild(gh);drag.ghost=gh;drag.el.classList.add('lifted');SF('card');}
    drag.ghost.style.left=(e.clientX-drag.dx)+'px';drag.ghost.style.top=(e.clientY-drag.dy)+'px';
    const under=document.elementFromPoint(e.clientX,e.clientY),sl=under&&under.closest('[data-slot]');
    mb.querySelectorAll('.slot.over').forEach(q=>{if(q!==sl)q.classList.remove('over');});if(sl)sl.classList.add('over');});
  const end=e=>{if(!drag)return;const d=drag;drag=null;
    if(!d.ghost){RUN.sel=RUN.sel===d.id?null:d.id;renderShop();return;}
    const under=document.elementFromPoint(e.clientX,e.clientY),sl=under&&under.closest('[data-slot]');d.ghost.remove();d.el.classList.remove('lifted');
    mb.querySelectorAll('.slot.over').forEach(q=>q.classList.remove('over'));
    if(sl){const [c,i]=sl.dataset.slot.split('|').map(Number);buyAbility(c,i,d.id);}};
  mb.addEventListener('pointerup',end);mb.addEventListener('pointercancel',()=>{if(drag&&drag.ghost){drag.ghost.remove();drag.el.classList.remove('lifted');}drag=null;});
  mb.addEventListener('click',e=>{
    const up=e.target.closest('[data-up]');if(up){const [c,i]=up.dataset.up.split('|').map(Number);upgradeAbility(c,i);return;}
    const sl=e.target.closest('[data-slot]');if(sl&&RUN.sel){const [c,i]=sl.dataset.slot.split('|').map(Number);buyAbility(c,i,RUN.sel);}
  });
}

/* ================= OVLÁDÁNÍ ================= */
function initCam(){fitWidth();if(viewSize().w<700)UI.cam.z=zLimits().max*.8;centerOn(START_X,(G&&G.startY||0)+1,false);}
function tryPlace(){const P=G.placing;if(!P||!tAllow('place'))return;
  if(P.req&&P.opts[P.i].join('')!==P.req.join('')){SF('hurt');const b=document.getElementById('tutbox');if(b){b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');}return;}
  finishPlace(P);}
function startNew(){closeModal();resetView();setSize('9x8');newGame();render();initCam();}
function onClick(ev){
  if(UI.suppress){ev.stopPropagation();ev.preventDefault();return;}
  if(ev.target.closest('#seq')){UI.fast=true;return;}
  if(ev.target.closest('#topr,#camctl,#menu'))return;
  if(UI.playing||UI.busy)return;
  if(UI.pending!=null&&!ev.target.closest('[data-c]')){UI.pending=null;setTimeout(render,0);}
  const t=ev.target.closest('button,.tok');if(!t)return;
  if(t.dataset.focus!=null){const ch=G.chars[+t.dataset.focus];centerOn(ch.x,ch.y,true);return;}
  const a=G.active!=null?G.chars[G.active]:null;
  if(t.dataset.a){
    const k=t.dataset.a;
    if(k==='close')closeModal();
    else if(k==='newrun'){closeModal();clearSave();showNaming();}
    else if(k==='testagain'){closeModal();startTest();}
    else if(k==='testmenu'){closeModal();showTestSetup();}
    else if(k==='tomenu'){closeModal();RUN=null;showMenu();}
    else if(k==='nextlvl'){if(G.tut){closeModal();tutNext();}else showMap();}
    else if(k==='shop')showOver();
    else if(k==='rot'){if(tAllow('rot')){rotatePlacing();SF('tick');}}
    else if(k==='place'&&G.placing)tryPlace();
    else if(k==='end'&&a){if(!tAllow('end'))return;pushUndo();endTurn(a,false);settle();}
    else if(k==='endall'&&!UI.endConfirm&&G.chars.some(c=>onBoard(c)&&!c.done&&!c.downed&&c.used<2)){UI.endConfirm=G.chars.filter(c=>onBoard(c)&&!c.done&&!c.downed&&c.used<2).map(c=>c.name).join(', ');SF('tick');render();clearTimeout(UI.ecT);UI.ecT=setTimeout(()=>{UI.endConfirm=null;render();},4000);}
    else if(k==='endall'){UI.endConfirm=null;t.classList.add('blink');SF('endturn');UI.busy=true;setTimeout(()=>{UI.busy=false;endAllTurns();},300);}
    else if(k==='tele'&&a){actTele(a);}
    else if(k==='douse'&&a){SF('splash');actDouse(a);}
    else if(k==='escape'&&a){if(escBlocked(a)){SF('hurt');floatText(a.x*CS+CS/2,a.y*CS+6,`Přece tu ${G.chars[2].name}e nenechám!`,false,'sm');log(`${a.name}: „Přece tu ${G.chars[2].name}e nenechám!“`,'bad');render();return;}SF('portal');flash('cyan',900);actEscape(a);}
    else if(k==='kill'&&a)actKill(a);
    else if(k==='gem'&&a){SF('clink');actPickGem(a);}
    else if(k==='serum'&&a){SF('clink');actPickSerum(a);}
    else if(k==='buyhp'){buyHp(+t.dataset.cid);}
    else if(k==='buytime'){buyTime();}
    else if(k==='swap'&&G.placing)swapPlacing();
    return;
  }
  if(t.dataset.c!=null){const id=+t.dataset.c,c=G.chars[id];if(!canSelect(c)||!tAllow('sel',id))return;
    const cur=G.active!=null?G.chars[G.active]:null;
    if(cur&&cur.id===id){if(UI.pending!=null){UI.pending=null;render();}return;}   // rozmyslel sis to: zpět k původní postavě
    if(cur&&cur.started&&cur.id!==id){
      if(UI.pending===id){UI.pending=null;pushUndo();log(`${cur.name} ukončil(a) tah.`);endTurn(cur,false);G.active=id;G.mode='move';settle();}
      else{UI.pending=id;render();}
      return;}
    UI.pending=null;G.active=id;G.mode='move';render();return;}
  if(!a||G.over)return;
  if(t.dataset.m){G.mode=G.mode===t.dataset.m?'move':t.dataset.m;render();return;}
  if(t.dataset.rv2!=null){actRevive(a,G.chars[+t.dataset.rv2]);return;}
  const rem=remaining(a);
  if(t.dataset.mv!=null){const m=moveOpts(a,a.downed)[+t.dataset.mv];if(m&&m.cost<=rem)actMove(a,m);return;}
  if(t.dataset.rv!=null){SF('card');actReveal(a,+t.dataset.rv,false);return;}
  if(t.dataset.ex!=null){SF('card');actReveal(a,+t.dataset.ex,true);return;}
  if(t.dataset.rp!=null){const o=ropeOptions(a)[+t.dataset.rp];if(o)actRope(a,o);return;}
  if(t.dataset.door!=null){const tg=doorTargets(a)[+t.dataset.door];if(tg){SF('slam',.4);actOpenDoor(a,tg);}return;}
  if(t.dataset.shoot!=null){const tg=shootTargets(a).find(q=>q.id===+t.dataset.shoot);if(tg){SF('boom');actShoot(a,tg);}return;}
  if(t.dataset.heal!=null){SF('breath',a.id);actHeal(a,G.chars[+t.dataset.heal]);return;}
  if(t.dataset.dy!=null){actDyn(a,+t.dataset.dy);return;}
  if(t.dataset.give!=null){const [f,to,i]=t.dataset.give.split('|').map(Number);SF('clink');actGive(G.chars[f],G.chars[to],i);return;}
  if(t.dataset.dg!=null){const d=digTargets(a)[+t.dataset.dg];if(d){SF('rumble');crumble(d.x,d.y);actDig(a,d);}return;}
}
function boot(){
  setSize('9x8');makeStatic();UI.wasDown={};
  try{SND.on=localStorage.getItem('hlubina-snd')!=='0';}catch(e){}
  const sb=document.getElementById('bSnd');sb.textContent=SND.on?'♪':'♪̸';sb.classList.toggle('off',!SND.on);
  UI.inMenu=true;UI.live=false;   // dokud hráč nezačne nebo nenačte výpravu, nic se neukládá (jinak by úvodní ukázková hra přepsala uloženou výpravu)
  UI.ready=true;newGame();setupCamera();
  document.addEventListener('pointerdown',()=>SND.init(),{once:false,passive:true});
  document.addEventListener('click',onClick,true);
  document.getElementById('bUndo').onclick=()=>{if(UI.playing)return;UI.ladShown=null;undo();};
  document.getElementById('bDeck').onclick=showDeck;
  document.getElementById('bLog').onclick=showLog;
  document.getElementById('bRules').onclick=showRules;
  document.getElementById('bSnd').onclick=()=>{SND.init();SND.toggle();sb.textContent=SND.on?'♪':'♪̸';sb.classList.toggle('off',!SND.on);};
  document.getElementById('bNew').onclick=()=>{UI.menuFromGame=true;showMenu();};
  setupMenu();setupTut();
  setupShopDnD();
  document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();if(!UI.playing){UI.ladShown=null;undo();}}
    if(e.key==='r'&&G.placing&&tAllow('rot'))rotatePlacing();
    if(e.key==='Enter'&&G.placing)tryPlace();
    if(e.key==='Escape')closeModal();
  });
  render();initCam();
  UI.menuFromGame=false;showMenu();
  requestAnimationFrame(loop);
}
if(typeof document!=='undefined')boot();

</script>
